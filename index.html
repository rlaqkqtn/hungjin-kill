<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ragdoll Clicker - Yumi Update</title>
    <style>
        body { margin: 0; background-color: #1a1a1b; color: white; font-family: 'Pretendard', sans-serif; overflow: hidden; user-select: none; cursor: none; }
        #custom-cursor { position: fixed; top: 0; left: 0; font-size: 60px; pointer-events: none; z-index: 999; transform: translate(-50%, -50%); border-radius: 50%; }
        
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 100; }
        .stat-container { background: rgba(0, 0, 0, 0.85); padding: 15px; border-radius: 12px; border-left: 5px solid #ffcc00; min-width: 250px; }
        .stat { font-size: 28px; margin-bottom: 5px; color: #ffcc00; font-weight: bold; }
        
        #gold-rush-ui { 
            position: absolute; top: 120px; left: 20px; display: none; 
            background: linear-gradient(45deg, #ffcc00, #ffae00); color: black; 
            padding: 12px 20px; font-weight: 900; border-radius: 8px; z-index: 100; 
            box-shadow: 0 0 30px #ffcc00; border: 2px solid white;
            animation: pulse 0.5s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }

        .menu-wrapper { position: absolute; right: 0; top: 0; height: 100vh; display: flex; align-items: center; z-index: 200; cursor: default; }
        .side-menu { background: rgba(30, 30, 35, 0.98); width: 300px; height: 100vh; padding: 20px; border-left: 2px solid #444; box-sizing: border-box; display: none; overflow-y: auto; }
        .side-menu.active { display: block; }
        .tab-container { display: flex; flex-direction: column; gap: 5px; }
        .menu-toggle { background: #ffcc00; color: #000; padding: 20px 10px; cursor: pointer; border-radius: 10px 0 0 10px; font-weight: bold; writing-mode: vertical-lr; border: none; font-size: 14px; }
        
        button { width: 100%; padding: 12px; margin: 6px 0; cursor: pointer; background: #3d3d40; color: white; border: 1px solid #555; font-size: 14px; font-weight: bold; border-radius: 8px; transition: 0.2s; }
        button:hover { background: #505055; transform: translateY(-2px); }
        .equipped { border: 2px solid #ffcc00 !important; color: #ffcc00 !important; }
        .locked { opacity: 0.6; cursor: not-allowed; }
        canvas { display: block; background: radial-gradient(circle, #333 0%, #111 100%); }

        /* 움직임 제어 스위치 스타일 */
        .toggle-btn { background: #673ab7; color: white; display: none; }
        .toggle-active { background: #00e676 !important; color: black !important; }
    </style>
</head>
<body>

<div id="custom-cursor">👊</div>

<div id="ui">
    <div class="stat-container">
        <div class="stat">💰 <span id="gold">0</span></div>
        <div style="font-size: 13px; color: #aaa;">형진이 부대: <span id="doll-count">1</span>명</div>
    </div>
</div>

<div id="gold-rush-ui">🔥 GOLD RUSH (x10) 🔥</div>

<div class="menu-wrapper">
    <div class="tab-container">
        <button class="menu-toggle" onclick="toggleMenu('shop')">상 점</button>
        <button class="menu-toggle" style="background:#4caf50" onclick="toggleMenu('storage')">가방</button>
    </div>
    <div id="shop" class="side-menu">
        <button id="move-lock-buy" onclick="buyMoveLock()" style="background: #673ab7; color: white;">🔒 움직임 고정 기능 (1,000,000G)</button>
        <hr>
        <button onclick="buyDoll()" style="background: #ff4444; color: white;">👤 형진이 추가 (500,000G)</button>
        <button onclick="upgradeAtk()">🔥 근력 강화 (<span id="atk-cost">500</span>G)</button>
        <div id="shop-items"></div>
    </div>
    <div id="storage" class="side-menu">
        <button id="move-toggle" class="toggle-btn" onclick="toggleMovement()">움직임: ON</button>
        <hr>
        <div id="inventory-items"></div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const cursor = document.getElementById('custom-cursor');
    const goldDisplay = document.getElementById('gold');
    const goldRushUI = document.getElementById('gold-rush-ui');

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let gold = 0, atkMultiplier = 1.0, upgradeCost = 500;
    let particles = [], floatingTexts = [], bullets = [], explosions = [];
    let clickHistory = [];
    let isGoldRush = false, goldRushTimer = 0;
    let mouseX = 0, mouseY = 0;
    
    // 움직임 제어 변수
    let canMove = true;
    let moveLockOwned = false;

    // 1. 유미(고양이)와 단검 분리
    const weapons = {
        punch: { name: '주먹', emoji: '👊', dmg: 30, price: 0, owned: true },
        dagger: { name: '단검', emoji: '🗡️', dmg: 150, price: 5000, owned: false },
        yumi: { name: '유미(고양이)', emoji: '🐱', dmg: 40, price: 25000, owned: false, isPet: true },
        poison: { name: '독극물', emoji: '🧪', dmg: 15, price: 10000, owned: false, isPoison: true },
        fire: { name: '화염구', emoji: '🔥', dmg: 500, price: 50000, owned: false, isFire: true },
        gun: { name: '권총', emoji: '🔫', dmg: 800, price: 120000, owned: false, isGun: true },
        bomb: { name: '폭탄', emoji: '💣', dmg: 20000, price: 300000, owned: false, isExplosive: true }
    };
    let currentWeapon = 'punch';

    class Doll {
        constructor() {
            this.x = Math.random() * (canvas.width - 400) + 200;
            this.y = Math.random() * (canvas.height - 400) + 200;
            this.vx = 0; this.vy = 0;
            this.charred = 0;
            this.poisonStacks = 0;
            this.level = 1;
            this.maxHp = 1000;
            this.hp = this.maxHp;
            this.parts = {
                head: { rx: 0, ry: -120, r: 45 },
                body: { rx: 0, ry: 0, w: 100, h: 140 },
                armL: { rx: -85, ry: -20, w: 35, h: 110 },
                armR: { rx: 85, ry: -20, w: 35, h: 110 },
                legL: { rx: -30, ry: 130, w: 40, h: 120 },
                legR: { rx: 30, ry: 130, w: 40, h: 120 }
            };
        }

        update() {
            if (canMove) {
                this.vy += 0.6; // 중력
                this.x += this.vx; this.y += this.vy;
                this.vx *= 0.98; this.vy *= 0.98;

                if (this.x < 150) { this.x = 150; this.vx *= -0.7; }
                if (this.x > canvas.width - 400) { this.x = canvas.width - 400; this.vx *= -0.7; }
                if (this.y > canvas.height - 200) { this.y = canvas.height - 200; this.vy *= -0.8; }
                if (this.y < 150) { this.y = 150; this.vy *= -0.7; }
            } else {
                // 고정 상태일 때는 속도 초기화
                this.vx = 0; this.vy = 0;
            }

            if (this.poisonStacks > 0) {
                const pDmg = this.poisonStacks * 0.4;
                this.hp -= pDmg;
                gold += pDmg * (isGoldRush ? 15 : 3);
                this.poisonStacks -= 0.05;
            }
            
            // 유미(고양이) 보유 시 자동 공격 로직
            if (weapons.yumi.owned && Math.random() < 0.02) {
                this.hp -= weapons.yumi.dmg;
                gold += weapons.yumi.dmg * 2;
                floatingTexts.push({ x: this.x, y: this.y - 50, text: "냥!", color: "#ffa726", life: 0.8 });
            }

            if (this.hp <= 0) this.respawn();
        }

        respawn() {
            const reward = 15000 * this.level;
            gold += reward;
            floatingTexts.push({ x: this.x, y: this.y, text: `LEVEL UP! +${reward.toLocaleString()}G`, color: "#ff4444", life: 2.0 });
            this.level++;
            this.maxHp *= 1.35;
            this.hp = this.maxHp;
            this.charred = 0; this.poisonStacks = 0;
            if (canMove) { this.vx = (Math.random()-0.5)*50; this.vy = -35; }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            ctx.fillStyle = "white";
            ctx.font = "bold 20px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(`형진이 Lv.${this.level}`, 0, -195);

            ctx.fillStyle = "#333"; ctx.fillRect(-60, -185, 120, 8);
            ctx.fillStyle = "#ff4444"; ctx.fillRect(-60, -185, (this.hp/this.maxHp)*120, 8);

            for (let k in this.parts) {
                const p = this.parts[k];
                const rColor = 224 - (this.charred * 180), gColor = 172 - (this.charred * 150), bColor = 105 - (this.charred * 90);
                ctx.fillStyle = `rgb(${rColor}, ${this.poisonStacks > 5 ? gColor+60 : gColor}, ${bColor})`;
                ctx.strokeStyle = "#000"; ctx.lineWidth = 3;

                if (p.r) {
                    ctx.beginPath(); ctx.arc(p.rx, p.ry, p.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                    if (k === 'head') {
                        ctx.fillStyle = "#000"; ctx.fillRect(p.rx-15, p.ry-10, 5, 5); ctx.fillRect(p.rx+10, p.ry-10, 5, 5);
                        ctx.beginPath(); ctx.arc(p.rx, p.ry+15, 12, 0, Math.PI); ctx.stroke();
                    }
                } else {
                    ctx.fillRect(p.rx - p.w/2, p.ry - p.h/2, p.w, p.h); ctx.strokeRect(p.rx - p.w/2, p.ry - p.h/2, p.w, p.h);
                }
            }
            ctx.restore();
        }
    }

    let dolls = [new Doll()];

    function toggleMenu(id) {
        const menus = document.querySelectorAll('.side-menu');
        menus.forEach(m => m.id === id ? m.classList.toggle('active') : m.classList.remove('active'));
    }

    // 움직임 고정 버튼 구매
    function buyMoveLock() {
        if (gold >= 1000000 && !moveLockOwned) {
            gold -= 1000000;
            moveLockOwned = true;
            document.getElementById('move-lock-buy').style.display = 'none';
            document.getElementById('move-toggle').style.display = 'block';
            updateUI();
        }
    }

    function toggleMovement() {
        canMove = !canMove;
        const btn = document.getElementById('move-toggle');
        btn.innerText = canMove ? "움직임: ON" : "움직임: OFF (고정됨)";
        btn.classList.toggle('toggle-active', !canMove);
    }

    function buyDoll() {
        if (gold >= 500000) {
            gold -= 500000;
            dolls.push(new Doll());
            document.getElementById('doll-count').innerText = dolls.length;
            updateUI();
        }
    }

    function upgradeAtk() {
        if (gold >= upgradeCost) {
            gold -= upgradeCost;
            atkMultiplier += 0.8;
            upgradeCost = Math.floor(upgradeCost * 2.2);
            updateUI();
        }
    }

    function applyDamage(targetDoll, dmg, x, y, isExplosion = false) {
        const finalDmg = dmg * atkMultiplier;
        targetDoll.hp -= finalDmg;
        const earned = Math.floor(finalDmg * (isGoldRush ? 15 : 4));
        gold += earned;

        if (weapons[currentWeapon].isFire) targetDoll.charred = Math.min(1, targetDoll.charred + 0.1);
        if (weapons[currentWeapon].isPoison) targetDoll.poisonStacks = Math.min(100, targetDoll.poisonStacks + 10);

        if (canMove) {
            let ang = Math.atan2(targetDoll.y - y, targetDoll.x - x);
            targetDoll.vx += Math.cos(ang) * (isExplosion ? 80 : 25);
            targetDoll.vy += Math.sin(ang) * (isExplosion ? 80 : 25);
        }

        floatingTexts.push({ x: x, y: y, text: `+${earned.toLocaleString()}G`, color: isGoldRush ? "#fff" : "#ffcc00", life: 1.0 });
        createBlood(x, y, isExplosion ? 30 : 8, targetDoll.poisonStacks > 15 ? "#44ff44" : "#ff0000");
    }

    function createBlood(x, y, count, color) {
        for(let i=0; i<count; i++) {
            particles.push({ x, y, vx: (Math.random()-0.5)*25, vy: (Math.random()-0.5)*25, life: 1.2, r: Math.random()*7+2, color });
        }
    }

    canvas.addEventListener('mousedown', (e) => {
        if (e.clientX > canvas.width - 320) return;

        if (currentWeapon === 'gun') {
            let target = dolls[0];
            let minDist = 9999;
            dolls.forEach(d => {
                let dDist = Math.hypot(d.x - mouseX, d.y - mouseY);
                if(dDist < minDist) { minDist = dDist; target = d; }
            });
            const angle = Math.atan2(target.y - mouseY, target.x - mouseX);
            bullets.push({ x: mouseX, y: mouseY, vx: Math.cos(angle) * 55, vy: Math.sin(angle) * 55, dmg: weapons.gun.dmg });
            return;
        }

        if (weapons[currentWeapon].isExplosive) {
            explosions.push({ x: mouseX, y: mouseY, r: 10, maxR: 350, life: 1.0 });
            dolls.forEach(d => {
                if (Math.hypot(d.x - mouseX, d.y - mouseY) < 350) applyDamage(d, weapons.bomb.dmg, mouseX, mouseY, true);
            });
            return;
        }

        dolls.forEach(d => {
            for (let k in d.parts) {
                const p = d.parts[k];
                const px = d.x + p.rx, py = d.y + p.ry;
                const hit = p.r ? Math.hypot(mouseX - px, mouseY - py) < p.r :
                                 (mouseX > px - p.w/2 && mouseX < px + p.w/2 && mouseY > py - p.h/2 && mouseY < py + p.h/2);
                if (hit) { applyDamage(d, weapons[currentWeapon].dmg, mouseX, mouseY); break; }
            }
        });
    });

    window.addEventListener('mousemove', (e) => { 
        mouseX = e.clientX; mouseY = e.clientY;
        cursor.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
    });

    function updateUI() {
        const shop = document.getElementById('shop-items');
        const inv = document.getElementById('inventory-items');
        shop.innerHTML = ''; inv.innerHTML = '';
        for (let id in weapons) {
            const w = weapons[id];
            const btn = document.createElement('button');
            btn.innerHTML = `${w.emoji} ${w.name} ${w.owned ? '' : '('+w.price.toLocaleString()+'G)'}`;
            if (w.owned) {
                btn.className = id === currentWeapon ? 'equipped' : '';
                btn.onclick = () => { currentWeapon = id; cursor.innerText = w.emoji; updateUI(); };
                inv.appendChild(btn);
            } else {
                btn.onclick = () => { if(gold >= w.price) { gold -= w.price; w.owned = true; updateUI(); } };
                shop.appendChild(btn);
            }
        }
        document.getElementById('atk-cost').innerText = upgradeCost.toLocaleString();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        dolls.forEach(d => d.update());
        dolls.forEach(d => d.draw());

        bullets.forEach((b, bi) => {
            b.x += b.vx; b.y += b.vy;
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(b.x, b.y, 8, 0, Math.PI*2); ctx.fill();
            dolls.forEach(d => {
                if (Math.hypot(b.x - d.x, b.y - d.y) < 100) { applyDamage(d, b.dmg, b.x, b.y); bullets.splice(bi, 1); }
            });
            if(b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(bi, 1);
        });

        explosions.forEach((ex, i) => {
            ctx.beginPath();
            let grad = ctx.createRadialGradient(ex.x, ex.y, 0, ex.x, ex.y, ex.r);
            grad.addColorStop(0, `rgba(255, 255, 255, ${ex.life})`);
            grad.addColorStop(0.3, `rgba(255, 200, 0, ${ex.life})`);
            grad.addColorStop(1, `rgba(255, 0, 0, 0)`);
            ctx.fillStyle = grad; ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI*2); ctx.fill();
            ex.r += 25; ex.life -= 0.05;
            if (ex.life <= 0) explosions.splice(i, 1);
        });

        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.life -= 0.02;
            ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life);
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            if(p.life <= 0) particles.splice(i, 1);
        });

        floatingTexts.forEach((t, i) => {
            ctx.globalAlpha = Math.max(0, t.life); ctx.fillStyle = t.color; 
            ctx.font = "bold 24px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(t.text, t.x, t.y); t.y -= 2; t.life -= 0.02;
            if(t.life <= 0) floatingTexts.splice(i, 1);
        });
        ctx.globalAlpha = 1;

        if (isGoldRush) {
            goldRushTimer--;
            if (goldRushTimer <= 0) { isGoldRush = false; goldRushUI.style.display = 'none'; }
        }

        goldDisplay.innerText = Math.floor(gold).toLocaleString();
        requestAnimationFrame(draw);
    }

    updateUI();
    draw();
</script>
</body>
</html>
