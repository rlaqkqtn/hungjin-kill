<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ragdoll Clicker - Impact & Wall Update</title>
    <style>
        body { margin: 0; background-color: #050505; color: white; font-family: 'Arial', sans-serif; overflow: hidden; user-select: none; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; }
        .stat { font-size: 32px; margin-bottom: 5px; color: #ff3333; text-shadow: 2px 2px 4px #000; font-weight: bold; }
        #shop { position: absolute; right: 20px; top: 20px; background: rgba(30, 0, 0, 0.9); padding: 15px; border-radius: 15px; border: 3px solid #ff0000; width: 240px; z-index: 10; }
        .shop-title { margin: 0 0 10px 0; color: #ff0000; font-size: 22px; text-align: center; font-weight: bold; }
        button { width: 100%; padding: 12px; margin: 5px 0; cursor: pointer; background: #800; color: white; border: 2px solid #f00; font-size: 16px; font-weight: bold; border-radius: 8px; }
        button:hover { background: #b00; transform: scale(1.02); }
        canvas { background: radial-gradient(circle, #222 0%, #050505 100%); display: block; }
        
        /* 맵 경계 비주얼 강화 */
        #map-frame {
            position: absolute;
            top: 20px; left: 20px; right: 20px; bottom: 20px;
            border: 4px solid rgba(255, 0, 0, 0.2);
            box-shadow: inset 0 0 50px rgba(255, 0, 0, 0.1);
            pointer-events: none;
            border-radius: 20px;
        }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat">골드: <span id="gold">0</span>G</div>
    <div class="stat">형진이 HP: <span id="hp">100</span> / <span id="max-hp">100</span></div>
</div>

<div id="shop">
    <div class="shop-title">무기 상점</div>
    <button onclick="addWeapon('🗡️', 100, 30)">칼 (100G)</button>
    <button onclick="addWeapon('⚙️', 300, 25)">톱니바퀴 (300G)</button>
    <button onclick="addWeapon('🔥', 800, 15)">화염방사기 (800G)</button>
    <button onclick="addWeapon('💣', 1500, 200)">폭탄 (1500G)</button>
    <button onclick="addWeapon('🐈', 3000, 15, true)">유미 소환 (3000G)</button>
</div>

<div id="map-frame"></div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let gold = 0;
    let maxHp = 100;
    let hp = 100;
    let isDead = false;
    let particles = [];
    let weapons = [];
    let floatingTexts = [];
    let draggedObj = null;
    let mouseX = 0, mouseY = 0;

    // --- 1. 타격음 개선 (더 찰진 임팩트 사운드) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playImpactSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        if (type === 'hit') {
            // "퍽" 하는 둔탁하고 찰진 소리
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        } else if (type === 'slash') {
            // "슉" 하는 날카로운 소리
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        } else if (type === 'dead') {
            // 무겁고 낮은 충격음
            osc.type = 'sine';
            osc.frequency.setValueAtTime(60, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        }

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    }

    const quotes = ["악!", "살려줘!", "아야!", "그만해!", "제발!", "으억!", "도와줘!"];

    let doll = {
        x: canvas.width / 2, y: canvas.height / 2,
        vx: 0, vy: 0, angle: 0,
        parts: [
            { name: 'head', rx: 0, ry: -70, r: 25, active: true },
            { name: 'body', rx: 0, ry: 0, w: 45, h: 70, active: true },
            { name: 'armL', rx: -35, ry: -15, w: 15, h: 45, active: true },
            { name: 'armR', rx: 35, ry: -15, w: 15, h: 45, active: true },
            { name: 'legL', rx: -15, ry: 65, w: 18, h: 55, active: true },
            { name: 'legR', rx: 15, ry: 65, w: 18, h: 55, active: true }
        ]
    };

    function applyDamage(amount, x, y, isClick = false) {
        if (isDead) return;
        hp -= amount;
        gold += isClick ? 10 : amount * 0.5;
        
        // 상황별 사운드 재생
        if (isClick) playImpactSound('hit');
        else if (Math.random() < 0.1) playImpactSound('slash');

        if (Math.random() < 0.2) createBlood(x, y, 8);
        if (Math.random() < 0.1) speak();
        if (hp <= 0) die();
    }

    function addWeapon(emoji, price, dmg, isYumi = false) {
        if(gold >= price) {
            gold -= price;
            weapons.push({
                x: canvas.width / 2, y: canvas.height / 2,
                emoji, dmg, angle: 0, isYumi, size: 65
            });
        }
    }

    function die() {
        if (isDead) return;
        isDead = true; hp = 0;
        playImpactSound('dead');
        createBlood(doll.x, doll.y, 100);
        setTimeout(() => {
            isDead = false;
            maxHp = Math.floor(maxHp * 1.2);
            hp = maxHp;
            doll.parts.forEach(p => p.active = true);
            doll.x = canvas.width / 2; doll.y = 200;
        }, 1000);
    }

    // --- 이벤트 핸들러 ---
    canvas.addEventListener('mousedown', (e) => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        let mx = e.clientX, my = e.clientY;
        draggedObj = weapons.find(w => Math.sqrt((mx-w.x)**2 + (my-w.y)**2) < 50);
        if(!draggedObj && !isDead) {
            if(Math.sqrt((mx-doll.x)**2 + (my-doll.y)**2) < 100) {
                applyDamage(15, mx, my, true);
                draggedObj = doll;
            }
        }
    });

    window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX; mouseY = e.clientY;
        if(draggedObj) { draggedObj.x = mouseX; draggedObj.y = mouseY; }
    });

    window.addEventListener('mouseup', () => { draggedObj = null; });

    // --- 메인 렌더 루프 ---
    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 맵 경계 설정 (안전 영역)
        const wallM = 40; 

        if(!isDead && draggedObj !== doll) {
            // 도망 AI (커서 피하기)
            let mDx = doll.x - mouseX;
            let mDy = doll.y - mouseY;
            let mDist = Math.sqrt(mDx*mDx + mDy*mDy);
            if(mDist < 200) { 
                doll.vx += (mDx / mDist) * 0.5;
                doll.vy += (mDy / mDist) * 0.5;
            }

            // 물리 시뮬레이션
            doll.x += doll.vx; doll.y += doll.vy;
            doll.vx *= 0.95; doll.vy *= 0.95;
            doll.vy += 0.4; // 중력

            // --- 2. 맵 이탈 방지 (강력한 벽 충돌 로직) ---
            if (doll.x < wallM) { doll.x = wallM; doll.vx *= -0.8; playImpactSound('hit'); }
            if (doll.x > canvas.width - wallM) { doll.x = canvas.width - wallM; doll.vx *= -0.8; playImpactSound('hit'); }
            if (doll.y < wallM) { doll.y = wallM; doll.vy *= -0.8; }
            if (doll.y > canvas.height - wallM) { doll.y = canvas.height - wallM; doll.vy *= -0.5; }
        }

        // 무기 및 고양이 로직
        weapons.forEach(w => {
            if(w.isYumi && !isDead && draggedObj !== w) {
                let dx = doll.x - w.x, dy = doll.y - w.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if(dist > 20) { w.x += (dx/dist)*4; w.y += (dy/dist)*4; }
            }
            // 무기 맵 이탈 방지
            w.x = Math.max(wallM, Math.min(canvas.width - wallM, w.x));
            w.y = Math.max(wallM, Math.min(canvas.height - wallM, w.y));

            ctx.font = `${w.size}px Arial`;
            ctx.save();
            ctx.translate(w.x, w.y);
            if(w.emoji === '⚙️') { w.angle += 0.2; ctx.rotate(w.angle); }
            ctx.fillText(w.emoji, -w.size/2, w.size/2);
            ctx.restore();

            if(Math.sqrt((w.x-doll.x)**2 + (w.y-doll.y)**2) < 80 && !isDead) {
                applyDamage(w.dmg / 5, w.x, w.y, false);
            }
        });

        // 인형 그리기
        ctx.save();
        ctx.translate(doll.x, doll.y);
        ctx.rotate(doll.angle);
        doll.parts.forEach(p => {
            if (!p.active) return;
            ctx.fillStyle = isDead ? '#333' : '#e0ac69';
            ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
            ctx.save();
            ctx.translate(p.rx, p.ry);
            if (p.name === 'head') {
                ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            } else {
                ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.strokeRect(-p.w/2, -p.h/2, p.w, p.h);
            }
            ctx.restore();
        });
        ctx.restore();

        // 파티클 및 텍스트
        floatingTexts.forEach((t, i) => {
            ctx.fillStyle = t.color || "#fff";
            ctx.globalAlpha = t.life;
            ctx.font = 'bold 30px Arial';
            ctx.fillText(t.text, t.x, t.y);
            t.y -= 1.2; t.life -= 0.02;
            if(t.life <= 0) floatingTexts.splice(i, 1);
        });
        ctx.globalAlpha = 1;

        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.02;
            ctx.fillStyle = `rgba(255,0,0,${p.life})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            if(p.life <= 0) particles.splice(i, 1);
        });

        document.getElementById('gold').innerText = Math.floor(gold);
        document.getElementById('hp').innerText = Math.ceil(hp);
        document.getElementById('max-hp').innerText = maxHp;
        requestAnimationFrame(render);
    }

    function createBlood(x, y, amount) {
        for(let i=0; i<amount; i++) {
            particles.push({
                x, y, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15,
                r: Math.random()*5+2, life: 1.5
            });
        }
    }

    function speak() {
        floatingTexts.push({ 
            x: doll.x + (Math.random()-0.5)*80, y: doll.y - 80, 
            text: quotes[Math.floor(Math.random()*quotes.length)], 
            life: 1.5, color: "#ff4444"
        });
    }

    render();
</script>
</body>
</html>
