<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ragdoll Clicker - Gold Rush & Fix</title>
    <style>
        body { margin: 0; background-color: #1a1a1b; color: white; font-family: 'Pretendard', sans-serif; overflow: hidden; user-select: none; cursor: none; }
        #custom-cursor { position: fixed; top: 0; left: 0; font-size: 60px; pointer-events: none; z-index: 999; transform: translate(-50%, -50%); }
        
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 100; }
        .stat-container { background: rgba(0, 0, 0, 0.85); padding: 15px; border-radius: 12px; border-left: 5px solid #ffcc00; min-width: 250px; }
        .stat { font-size: 28px; margin-bottom: 5px; color: #ffcc00; font-weight: bold; }
        
        /* 골드러쉬 알림 */
        #gold-rush-notice { color: #ffeb3b; font-size: 18px; font-weight: bold; display: none; animation: blink 0.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }

        #ammo-ui { font-size: 18px; color: #fff; margin-top: 10px; display: none; }
        #reload-bar { width: 100%; height: 8px; background: #444; margin-top: 5px; border-radius: 4px; overflow: hidden; display: none; }
        #reload-progress { width: 0%; height: 100%; background: #00e676; }

        .menu-wrapper { position: absolute; right: 0; top: 0; height: 100vh; display: flex; align-items: center; z-index: 200; cursor: default; }
        .side-menu { background: rgba(30, 30, 35, 0.98); width: 300px; height: 100vh; padding: 20px; border-left: 2px solid #444; box-sizing: border-box; display: none; overflow-y: auto; }
        .side-menu.active { display: block; }
        .tab-container { display: flex; flex-direction: column; gap: 5px; }
        .menu-toggle { background: #ffcc00; color: #000; padding: 20px 10px; cursor: pointer; border-radius: 10px 0 0 10px; font-weight: bold; writing-mode: vertical-lr; border: none; font-size: 14px; }
        
        button { width: 100%; padding: 12px; margin: 6px 0; cursor: pointer; background: #3d3d40; color: white; border: 1px solid #555; font-size: 14px; font-weight: bold; border-radius: 8px; transition: 0.2s; }
        button:hover:not(:disabled) { background: #505055; transform: translateY(-2px); }
        .equipped { border: 2px solid #ffcc00 !important; color: #ffcc00 !important; }
        
        .toggle-btn { background: #444; color: white; }
        .toggle-active { background: #00e676 !important; color: black !important; }
        .remove-btn { background: #5c0000 !important; color: #ff8888; border: 1px solid #ff4444; }

        canvas { display: block; background: radial-gradient(circle, #333 0%, #111 100%); }
    </style>
</head>
<body>

<div id="custom-cursor">👊</div>

<div id="ui">
    <div class="stat-container">
        <div class="stat">💰 <span id="gold">0</span></div>
        <div id="gold-rush-notice">✨ GOLD RUSH (x10) ✨</div>
        <div style="font-size: 13px; color: #aaa;">형진이 부대: <span id="doll-count">1</span>명</div>
        <div id="ammo-ui">🔫 탄창: <span id="ammo-count">30</span> / 30</div>
        <div id="reload-bar"><div id="reload-progress"></div></div>
    </div>
</div>

<div class="menu-wrapper">
    <div class="tab-container">
        <button class="menu-toggle" onclick="toggleMenu('shop')">상 점</button>
        <button class="menu-toggle" style="background:#4caf50" onclick="toggleMenu('storage')">가방</button>
    </div>
    <div id="shop" class="side-menu">
        <button id="moveLock-buy" style="background:#673ab7" onclick="buyFeature('moveLock', 100000000000)">🔒 움직임 고정 구매 (1,000억G)</button>
        <button id="bleed-buy" style="background:#cc0000;" onclick="buyFeature('bleed', 1000000)">🩸 출혈 효과 구매 (100만G)</button>
        <hr>
        <button onclick="buyDoll()" style="background: #ff4444; color: white;">👤 형진이 추가 (500,000G)</button>
        <button class="remove-btn" onclick="removeDoll()">❌ 마지막 형진이 제거</button>
        <button onclick="upgradeAtk()">🔥 근력 강화 (<span id="atk-cost">500</span>G)</button>
        <div id="shop-items"></div>
    </div>
    <div id="storage" class="side-menu">
        <button id="moveLock-toggle" class="toggle-btn" style="display:none" onclick="toggleOption('moveLock')">고정 장치: OFF</button>
        <button id="bleed-toggle" class="toggle-btn" style="display:none" onclick="toggleOption('bleed')">출혈 효과: ON</button>
        <hr>
        <div id="inventory-items"></div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const cursor = document.getElementById('custom-cursor');
    const goldDisplay = document.getElementById('gold');

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let gold = 0, atkMultiplier = 1.0, upgradeCost = 500;
    let floatingTexts = [], bullets = [], particles = [];
    let mouseX = 0, mouseY = 0;
    
    // 골드러쉬 시스템
    let goldRushActive = false;
    let goldRushTimer = 0;

    let options = { moveLock: false, bleed: true };
    let unlocks = { moveLock: false, bleed: false };

    let currentAmmo = 30;
    let isReloading = false;

    const weapons = {
        punch: { name: '주먹', emoji: '👊', dmg: 30, price: 0, owned: true },
        dagger: { name: '단검', emoji: '🗡️', dmg: 150, price: 5000, owned: false },
        poison: { name: '독극물', emoji: '🧪', dmg: 20, price: 10000, owned: false, isPoison: true },
        fire: { name: '화염구', emoji: '🔥', dmg: 600, price: 50000, owned: false, isFire: true },
        bomb: { name: '폭탄', emoji: '💣', dmg: 5000, price: 300000, owned: false, isBomb: true },
        gun: { name: '권총', emoji: '🔫', dmg: 1200, price: 150000, owned: false, isGun: true }
    };
    let currentWeapon = 'punch';

    class Doll {
        constructor() {
            this.respawnPosition();
            this.level = 1;
            this.maxHp = 1000;
            this.hp = this.maxHp;
            this.poisonStacks = 0;
            this.fireTicks = 0;
            this.speech = "";
            this.speechTimer = 0;
            this.parts = {
                head: { rx: 0, ry: -120, r: 45 },
                body: { rx: 0, ry: 0, w: 100, h: 140 },
                armL: { rx: -85, ry: -20, w: 35, h: 110 },
                armR: { rx: 85, ry: -20, w: 35, h: 110 },
                legL: { rx: -30, ry: 130, w: 40, h: 120 },
                legR: { rx: 30, ry: 130, w: 40, h: 120 }
            };
        }

        respawnPosition() {
            this.x = Math.random() * (canvas.width - 600) + 300;
            this.y = 200;
            this.vx = (Math.random() - 0.5) * 10;
            this.vy = -5;
        }

        say(text) { this.speech = text; this.speechTimer = 80; }

        update() {
            // 움직임 고정 로직 수리: options.moveLock이 true이면 물리 계산을 건너뜀
            if (!options.moveLock) {
                this.vy += 0.8; 
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.98;
                this.vy *= 0.98;

                if (this.y > canvas.height - 180) { this.y = canvas.height - 180; this.vy *= -0.5; }
                if (this.y < 120) { this.y = 120; this.vy *= -0.5; }
                if (this.x < 120) { this.x = 120; this.vx *= -0.5; }
                if (this.x > canvas.width - 350) { this.x = canvas.width - 350; this.vx *= -0.5; }
            } else {
                this.vx = 0; this.vy = 0;
            }

            if (this.poisonStacks > 0) { this.hp -= this.poisonStacks * 0.2; this.poisonStacks -= 0.01; }
            if (this.fireTicks > 0) { this.hp -= 5; this.fireTicks--; }
            if (this.speechTimer > 0) this.speechTimer--;
            if (this.hp <= 0) this.respawn();
        }

        respawn() {
            addGold(100000 * this.level);
            this.level++;
            this.maxHp *= 1.4;
            this.hp = this.maxHp;
            this.poisonStacks = 0;
            this.fireTicks = 0;
            if(!options.moveLock) this.respawnPosition();
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            if (this.speechTimer > 0) {
                ctx.fillStyle = "white"; ctx.font = "bold 18px Arial"; ctx.textAlign = "center";
                ctx.fillText(this.speech, 0, -230);
            }
            ctx.fillStyle = "white"; ctx.font = "bold 20px Arial"; ctx.textAlign = "center";
            ctx.fillText(`형진이 Lv.${this.level}`, 0, -195);
            ctx.fillStyle = "#333"; ctx.fillRect(-60, -185, 120, 8);
            ctx.fillStyle = this.poisonStacks > 0 ? "#00ff00" : (this.fireTicks > 0 ? "#ffaa00" : "#ff4444");
            ctx.fillRect(-60, -185, (this.hp / this.maxHp) * 120, 8);
            for (let k in this.parts) {
                const p = this.parts[k];
                ctx.fillStyle = this.fireTicks > 0 ? "#552200" : "#e0ac69";
                ctx.strokeStyle = "#000";
                if (p.r) { 
                    ctx.beginPath(); ctx.arc(p.rx, p.ry, p.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = "black";
                    ctx.beginPath(); ctx.arc(p.rx - 15, p.ry - 10, 4, 0, Math.PI * 2); ctx.arc(p.rx + 15, p.ry - 10, 4, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(p.rx, p.ry + 10, 15, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
                } else {
                    ctx.fillRect(p.rx - p.w/2, p.ry - p.h/2, p.w, p.h); ctx.strokeRect(p.rx - p.w/2, p.ry - p.h/2, p.w, p.h);
                }
            }
            ctx.restore();
        }
    }

    let dolls = [new Doll()];

    function addGold(amount) {
        let multiplier = goldRushActive ? 10 : 1;
        gold += amount * multiplier;
        
        // 1% 확률로 골드러쉬 발생
        if (!goldRushActive && Math.random() < 0.01) {
            startGoldRush();
        }
    }

    function startGoldRush() {
        goldRushActive = true;
        goldRushTimer = 500; // 약 8초
        document.getElementById('gold-rush-notice').style.display = 'block';
    }

    function buyFeature(key, price) {
        if (gold >= price && !unlocks[key]) {
            gold -= price;
            unlocks[key] = true;
            document.getElementById(key + '-buy').style.display = 'none';
            document.getElementById(key + '-toggle').style.display = 'block';
            updateUI();
        }
    }

    function toggleOption(key) {
        options[key] = !options[key];
        const btn = document.getElementById(key + '-toggle');
        btn.innerText = (key === 'moveLock' ? "고정 장치: " : "출혈 효과: ") + (options[key] ? "ON" : "OFF");
        btn.classList.toggle('toggle-active', options[key]);
    }

    function buyDoll() {
        if (gold >= 500000) {
            gold -= 500000;
            dolls.push(new Doll());
            document.getElementById('doll-count').innerText = dolls.length;
        }
    }

    function removeDoll() {
        if (dolls.length > 1) {
            dolls.pop();
            document.getElementById('doll-count').innerText = dolls.length;
        } else {
            alert("최소 한 명의 형진이는 남겨둬야 합니다!");
        }
    }

    function spawnBlood(x, y) {
        if (!options.bleed) return;
        for(let i=0; i<5; i++) {
            particles.push({ x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, size: Math.random()*4+2, life: 1, color: "#cc0000" });
        }
    }

    function explode(x, y) {
        for(let i=0; i<30; i++) {
            particles.push({ x, y, vx: (Math.random()-0.5)*30, vy: (Math.random()-0.5)*30, size: Math.random()*15+5, life: 1, color: Math.random() > 0.5 ? "#ffcc00" : "#ff4400" });
        }
        dolls.forEach(d => {
            const dist = Math.hypot(d.x - x, d.y - y);
            if (dist < 400) {
                applyDamage(d, weapons.bomb.dmg * ((400-dist)/400), d.x, d.y, false);
                d.say("콰광!!!");
            }
        });
    }

    canvas.addEventListener('mousedown', (e) => {
        if (e.clientX > canvas.width - 320) return;
        if (currentWeapon === 'bomb') { explode(mouseX, mouseY); return; }
        if (currentWeapon === 'gun') {
            if (isReloading || currentAmmo <= 0) { reloadGun(); return; }
            currentAmmo--;
            document.getElementById('ammo-count').innerText = currentAmmo;
            bullets.push({ x: mouseX, y: mouseY, vx: 60, vy: (Math.random()-0.5)*5, dmg: weapons.gun.dmg });
            return;
        }
        dolls.forEach(d => {
            for (let k in d.parts) {
                const p = d.parts[k];
                if (Math.hypot(mouseX - (d.x+p.rx), mouseY - (d.y+p.ry)) < 70) {
                    if (weapons[currentWeapon].isPoison) d.poisonStacks += 10;
                    if (weapons[currentWeapon].isFire) d.fireTicks = 100;
                    applyDamage(d, weapons[currentWeapon].dmg, mouseX, mouseY);
                }
            }
        });
    });

    function applyDamage(targetDoll, dmg, x, y, blood = true) {
        const finalDmg = dmg * atkMultiplier;
        targetDoll.hp -= finalDmg;
        addGold(finalDmg * 15);
        if (!options.moveLock) {
            targetDoll.vx += (targetDoll.x - x) * 0.2;
            targetDoll.vy += (targetDoll.y - y) * 0.2;
        }
        if (blood) spawnBlood(x, y);
        floatingTexts.push({ x, y, text: `+${Math.floor(finalDmg*15*(goldRushActive?10:1))}`, color: goldRushActive ? "#fff700" : "#ffcc00", life: 1 });
    }

    function updateUI() {
        const shop = document.getElementById('shop-items');
        const inv = document.getElementById('inventory-items');
        shop.innerHTML = ''; inv.innerHTML = '';
        document.getElementById('ammo-ui').style.display = (currentWeapon === 'gun') ? 'block' : 'none';
        for (let id in weapons) {
            const w = weapons[id];
            const btn = document.createElement('button');
            btn.innerHTML = `${w.emoji} ${w.name} ${w.owned ? '' : '('+w.price.toLocaleString()+'G)'}`;
            if (w.owned) {
                btn.className = id === currentWeapon ? 'equipped' : '';
                btn.onclick = () => { currentWeapon = id; cursor.innerText = w.emoji; updateUI(); };
                inv.appendChild(btn);
            } else {
                btn.onclick = () => { if(gold >= w.price) { gold -= w.price; w.owned = true; updateUI(); } };
                shop.appendChild(btn);
            }
        }
    }

    function upgradeAtk() {
        if (gold >= upgradeCost) {
            gold -= upgradeCost; atkMultiplier += 1.2; upgradeCost *= 2.8;
            document.getElementById('atk-cost').innerText = Math.floor(upgradeCost).toLocaleString();
        }
    }

    function reloadGun() {
        if (isReloading) return;
        isReloading = true;
        document.getElementById('reload-bar').style.display = 'block';
        let progress = 0;
        const interval = setInterval(() => {
            progress += 10;
            document.getElementById('reload-progress').style.width = progress + '%';
            if (progress >= 100) { clearInterval(interval); currentAmmo = 30; isReloading = false;
                document.getElementById('reload-bar').style.display = 'none';
                document.getElementById('ammo-count').innerText = currentAmmo;
            }
        }, 80);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (goldRushActive) {
            goldRushTimer--;
            if (goldRushTimer <= 0) {
                goldRushActive = false;
                document.getElementById('gold-rush-notice').style.display = 'none';
            }
        }
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.02;
            ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
            if(p.life <= 0) particles.splice(i, 1);
        });
        ctx.globalAlpha = 1;
        dolls.forEach(d => { d.update(); d.draw(); });
        bullets.forEach((b, i) => {
            b.x += b.vx; b.y += b.vy;
            ctx.fillStyle = "yellow"; ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
            dolls.forEach(d => {
                if (Math.hypot(b.x - d.x, b.y - d.y) < 100) { applyDamage(d, b.dmg, b.x, b.y); bullets.splice(i, 1); }
            });
            if(b.x > canvas.width) bullets.splice(i, 1);
        });
        floatingTexts.forEach((t, i) => {
            ctx.fillStyle = t.color; ctx.font = "bold 20px Arial";
            ctx.fillText(t.text, t.x, t.y); t.y -= 2; t.life -= 0.02;
            if(t.life <= 0) floatingTexts.splice(i, 1);
        });
        goldDisplay.innerText = Math.floor(gold).toLocaleString();
        requestAnimationFrame(draw);
    }

    window.addEventListener('mousemove', (e) => { 
        mouseX = e.clientX; mouseY = e.clientY;
        cursor.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
    });
    
    function toggleMenu(id) {
        document.querySelectorAll('.side-menu').forEach(m => m.id === id ? m.classList.toggle('active') : m.classList.remove('active'));
    }

    updateUI();
    draw();
</script>
</body>
</html>
