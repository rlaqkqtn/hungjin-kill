<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ragdoll Clicker - Gold Fix</title>
    <style>
        body { margin: 0; background-color: #1a1a1b; color: white; font-family: 'Pretendard', sans-serif; overflow: hidden; user-select: none; cursor: none; }
        #custom-cursor { position: fixed; top: 0; left: 0; font-size: 60px; pointer-events: none; z-index: 999; transform: translate(-50%, -50%); will-change: transform; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 100; }
        .stat-container { background: rgba(0, 0, 0, 0.85); padding: 15px; border-radius: 12px; border-left: 5px solid #ffcc00; min-width: 220px; }
        .stat { font-size: 26px; margin-bottom: 5px; color: #ffcc00; font-weight: bold; }
        #hp-bar-container { width: 100%; height: 12px; background: #333; border-radius: 6px; overflow: hidden; margin-top: 10px; border: 1px solid #555; }
        #hp-inner { width: 100%; height: 100%; background: linear-gradient(90deg, #ff4444, #ff8888); transition: width 0.1s; }
        
        .menu-wrapper { position: absolute; right: 0; top: 0; height: 100vh; display: flex; align-items: center; z-index: 200; cursor: default; }
        .side-menu { background: rgba(30, 30, 35, 0.98); width: 280px; height: 100vh; padding: 20px; border-left: 2px solid #444; box-sizing: border-box; display: none; overflow-y: auto; }
        .side-menu.active { display: block; }
        .tab-container { display: flex; flex-direction: column; gap: 5px; }
        .menu-toggle { background: #ffcc00; color: #000; padding: 20px 10px; cursor: pointer; border-radius: 10px 0 0 10px; font-weight: bold; writing-mode: vertical-lr; border: none; font-size: 14px; }
        
        button { width: 100%; padding: 12px; margin: 6px 0; cursor: pointer; background: #3d3d40; color: white; border: 1px solid #555; font-size: 14px; font-weight: bold; border-radius: 8px; }
        button:hover { background: #505055; }
        .equipped { border: 2px solid #ffcc00 !important; color: #ffcc00 !important; }
        
        canvas { display: block; background: #252527; }
        #gold-rush-ui { position: absolute; top: 150px; left: 20px; display: none; background: #ffcc00; color: black; padding: 10px; font-weight: bold; border-radius: 5px; z-index: 100; box-shadow: 0 0 20px #ffcc00; }
    </style>
</head>
<body>

<div id="custom-cursor">👊</div>

<div id="ui">
    <div class="stat-container">
        <!-- 골드 표시 부분 강조 -->
        <div class="stat">💰 <span id="gold">0</span></div>
        <div style="font-size: 13px; color: #aaa;">형진이 방어력: Lv.<span id="doll-lv">1</span></div>
        <div id="hp-bar-container"><div id="hp-inner"></div></div>
    </div>
</div>

<div id="gold-rush-ui">🔥 GOLD RUSH (x3)!</div>

<div class="menu-wrapper">
    <div class="tab-container">
        <button class="menu-toggle" onclick="toggleMenu('shop')">상 점</button>
        <button class="menu-toggle" style="background:#4caf50" onclick="toggleMenu('storage')">인벤토리</button>
    </div>
    <div id="shop" class="side-menu">
        <button onclick="upgradeAtk()">🔥 공격력 강화 (<span id="atk-cost">500</span>G)</button>
        <div id="shop-items"></div>
    </div>
    <div id="storage" class="side-menu">
        <div id="inventory-items"></div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const cursor = document.getElementById('custom-cursor');
    const goldDisplay = document.getElementById('gold');
    
    let isGameRunning = false;

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    // 초기 골드 0 설정
    let gold = 0; 
    let isDead = false, atkMultiplier = 1.0, upgradeCost = 500;
    let particles = [], floatingTexts = [], explosions = [], bullets = [];
    let mouseX = 0, mouseY = 0;
    let lastHitTime = Date.now();
    let dollLv = 1;
    let clickHistory = [];
    let isGoldRush = false;
    let goldRushTimer = 0;

    const weapons = {
        punch: { name: '기본 주먹', emoji: '👊', dmg: 20, price: 0, owned: true },
        yumi: { name: '유미', emoji: '🐱', dmg: 80, price: 500, owned: false },
        dagger: { name: '단검', emoji: '🗡️', dmg: 140, price: 1200, owned: false },
        poison: { name: '독극물', emoji: '🧪', dmg: 15, price: 3000, owned: false, isPoison: true },
        gun: { name: '권총', emoji: '🔫', dmg: 110, price: 8000, owned: false, isGun: true },
        gear: { name: '톱니바퀴', emoji: '⚙️', dmg: 70, price: 15000, owned: false, isPlaced: true },
        fire: { name: '화염구', emoji: '🔥', dmg: 400, price: 35000, owned: false, isFire: true },
        bomb: { name: '폭탄', emoji: '💣', dmg: 2500, price: 80000, owned: false, isExplosive: true }
    };
    let currentWeapon = 'punch';
    let placedGear = null;

    let doll = {
        x: canvas.width / 2, y: canvas.height / 2, vx: 0, vy: 0, 
        charred: 0, poisonStacks: 0,
        parts: {
            head: { rx: 0, ry: -120, r: 45, hp: 150, max: 150, active: true },
            body: { rx: 0, ry: 0, w: 100, h: 140, hp: 500, max: 500, active: true },
            armL: { rx: -85, ry: -20, w: 35, h: 110, hp: 100, max: 100, active: true },
            armR: { rx: 85, ry: -20, w: 35, h: 110, hp: 100, max: 100, active: true },
            legL: { rx: -30, ry: 130, w: 40, h: 120, hp: 130, max: 130, active: true },
            legR: { rx: 30, ry: 130, w: 40, h: 120, hp: 130, max: 130, active: true }
        }
    };

    const screams = ["아야!", "형진이 아파!", "그만해!", "악!", "난 게이일 뿐이야", "멈춰!", "히익!"];

    function toggleMenu(id) {
        const menus = document.querySelectorAll('.side-menu');
        menus.forEach(m => m.id === id ? m.classList.toggle('active') : m.classList.remove('active'));
    }

    function updateUI() {
        const shop = document.getElementById('shop-items');
        const inv = document.getElementById('inventory-items');
        shop.innerHTML = ''; inv.innerHTML = '';
        for (let id in weapons) {
            const w = weapons[id];
            const btn = document.createElement('button');
            btn.innerHTML = `${w.emoji} ${w.name} ${w.owned ? '' : '('+w.price+'G)'}`;
            if (w.owned) {
                btn.className = id === currentWeapon ? 'equipped' : '';
                btn.onclick = () => { currentWeapon = id; cursor.innerText = w.emoji; updateUI(); };
                inv.appendChild(btn);
            } else {
                btn.onclick = () => { if(gold >= w.price) { gold -= w.price; w.owned = true; updateUI(); } };
                shop.appendChild(btn);
            }
        }
        goldDisplay.innerText = Math.floor(gold).toLocaleString(); // 콤마 추가
        document.getElementById('atk-cost').innerText = upgradeCost;
    }

    function upgradeAtk() {
        if (gold >= upgradeCost) {
            gold -= upgradeCost;
            atkMultiplier += 1.0;
            upgradeCost = Math.floor(upgradeCost * 2.5);
            updateUI();
        }
    }

    function applyDamage(key, dmg, x, y, isAuto = false) {
        if (isDead || !doll.parts[key].active) return;
        
        lastHitTime = Date.now();
        const part = doll.parts[key];
        const finalDmg = dmg * atkMultiplier;
        
        part.hp -= finalDmg;

        // --- 돈 들어오는 로직 강화 ---
        const earned = Math.floor(finalDmg * (isGoldRush ? 3 : 1.2));
        gold += earned; // 전역 gold 변수에 합산
        
        // 돈 획득 텍스트 표시
        if (earned > 0) {
            floatingTexts.push({ x: x, y: y - 20, text: `+${earned}G`, color: "#ffcc00", life: 1.0 });
        }

        // 물리 효과
        let ang = Math.atan2(doll.y + part.ry - y, doll.x + part.rx - x);
        doll.vx += Math.cos(ang) * (isAuto ? 2 : 12);
        doll.vy += Math.sin(ang) * (isAuto ? 2 : 12);

        if (weapons[currentWeapon].isFire) doll.charred = Math.min(1, doll.charred + 0.02);
        if (weapons[currentWeapon].isPoison) doll.poisonStacks = Math.min(50, doll.poisonStacks + 1);

        if (part.hp <= 0) {
            if (key === 'body') {
                isDead = true;
                gold += dollLv * 1000; // 처치 보너스
                floatingTexts.push({ x: doll.x, y: doll.y, text: `KO 보너스 +${dollLv * 1000}G`, color: "#ffff00", life: 1.5 });
                setTimeout(respawn, 1500);
            } else { part.active = false; }
        }

        if (!isAuto && Math.random() < 0.2) {
            floatingTexts.push({ x: doll.x, y: doll.y - 120, text: screams[Math.floor(Math.random()*screams.length)], color: "#ff4444", life: 1.0 });
        }
        createBlood(x, y, isAuto ? 1 : 8);
    }

    function respawn() {
        isDead = false; dollLv++;
        document.getElementById('doll-lv').innerText = dollLv;
        doll.x = canvas.width / 2; doll.y = canvas.height / 2;
        doll.vx = 0; doll.vy = 0; doll.charred = 0; doll.poisonStacks = 0;
        for (let k in doll.parts) {
            doll.parts[k].max *= 1.4;
            doll.parts[k].hp = doll.parts[k].max;
            doll.parts[k].active = true;
        }
        updateUI();
    }

    function createBlood(x, y, count) {
        for(let i=0; i<count; i++) {
            particles.push({x, y, vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12, life: 1, r: Math.random()*3+2, color: doll.poisonStacks > 5 ? "#44ff44" : "#ff0000"});
        }
    }

    window.addEventListener('mousemove', (e) => { 
        mouseX = e.clientX; mouseY = e.clientY;
        cursor.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
    });

    canvas.addEventListener('mousedown', (e) => {
        if (e.clientX > canvas.width - 300) return;
        const now = Date.now();
        clickHistory.push(now);
        clickHistory = clickHistory.filter(t => now - t < 800);
        if (clickHistory.length >= 10 && !isGoldRush) {
            isGoldRush = true; goldRushTimer = 400;
            document.getElementById('gold-rush-ui').style.display = 'block';
        }

        if (weapons[currentWeapon].isGun) {
            const angle = Math.atan2(doll.y - mouseY, doll.x - mouseX);
            bullets.push({ x: mouseX, y: mouseY, vx: Math.cos(angle) * 30, vy: Math.sin(angle) * 30, dmg: weapons.gun.dmg });
            return;
        }
        if (weapons[currentWeapon].isPlaced) { placedGear = { x: mouseX, y: mouseY, lastHit: 0 }; return; }

        for (let k in doll.parts) {
            const p = doll.parts[k]; if (!p.active) continue;
            const px = doll.x + p.rx, py = doll.y + p.ry;
            const hit = p.r ? Math.hypot(mouseX - px, mouseY - py) < p.r :
                             (mouseX > px - p.w/2 && mouseX < px + p.w/2 && mouseY > py - p.h/2 && mouseY < py + p.h/2);
            if (hit) {
                applyDamage(k, weapons[currentWeapon].dmg, mouseX, mouseY);
                if(weapons[currentWeapon].isExplosive) explosions.push({x: mouseX, y: mouseY, r: 10, life: 1});
                break;
            }
        }
    });

    function update() {
        if (!isDead) {
            if (Date.now() - lastHitTime > 5000) {
                doll.vx += (canvas.width / 2 - doll.x) * 0.02;
                doll.vy += (canvas.height / 2 - doll.y) * 0.02;
            } else { doll.vy += 0.5; }

            doll.x += doll.vx; doll.y += doll.vy;
            doll.vx *= 0.96; doll.vy *= 0.96;

            if (doll.poisonStacks > 0) {
                applyDamage('body', doll.poisonStacks * 0.05, doll.x, doll.y, true);
                doll.poisonStacks -= 0.02;
            }

            if (doll.x < 100) { doll.x = 100; doll.vx *= -0.5; }
            if (doll.x > canvas.width - 350) { doll.x = canvas.width - 350; doll.vx *= -0.5; }
            if (doll.y > canvas.height - 150) { doll.y = canvas.height - 150; doll.vy *= -0.5; }
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i]; b.x += b.vx; b.y += b.vy;
            for (let k in doll.parts) {
                const p = doll.parts[k]; if (!p.active) continue;
                const px = doll.x + p.rx, py = doll.y + p.ry;
                if (p.r ? Math.hypot(b.x - px, b.y - py) < p.r : (b.x > px - p.w/2 && b.x < px + p.w/2 && b.y > py - p.h/2 && b.y < py + p.h/2)) {
                    applyDamage(k, b.dmg, b.x, b.y); bullets.splice(i, 1); break;
                }
            }
            if (b && (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height)) bullets.splice(i, 1);
        }

        if (isGoldRush) {
            goldRushTimer--;
            if (goldRushTimer <= 0) { isGoldRush = false; document.getElementById('gold-rush-ui').style.display = 'none'; }
        }

        if (placedGear && weapons[currentWeapon].isPlaced) {
            if (Date.now() - placedGear.lastHit > 500) {
                for(let k in doll.parts) {
                    if(!doll.parts[k].active) continue;
                    if (Math.hypot(placedGear.x - (doll.x + doll.parts[k].rx), placedGear.y - (doll.y + doll.parts[k].ry)) < 100) {
                        applyDamage(k, weapons.gear.dmg, placedGear.x, placedGear.y, true); 
                        placedGear.lastHit = Date.now(); break;
                    }
                }
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        for (let k in doll.parts) {
            const p = doll.parts[k]; if (!p.active) continue;
            const px = doll.x + p.rx, py = doll.y + p.ry;
            let r = 224 - (doll.charred * 180), g = 172 - (doll.charred * 150), b = 105 - (doll.charred * 90);
            if (doll.poisonStacks > 5) { g += 40; r -= 20; b -= 20; }
            ctx.fillStyle = isDead ? "#444" : `rgb(${r},${g},${b})`;
            ctx.strokeStyle = "#000"; ctx.lineWidth = 3;
            if (p.r) {
                ctx.beginPath(); ctx.arc(px, py, p.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                if (k === 'head') {
                    ctx.fillStyle = "white"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "center";
                    ctx.fillText("형진이", px, py - 60);
                    ctx.fillStyle = "#000";
                    if (!isDead) {
                        ctx.fillRect(px-15, py-10, 4, 4); ctx.fillRect(px+11, py-10, 4, 4);
                        ctx.beginPath(); ctx.arc(px, py+10, 10, 0, Math.PI); ctx.stroke();
                    } else { ctx.font = "bold 20px sans-serif"; ctx.fillText("X X", px, py); }
                }
            } else { ctx.fillRect(px - p.w/2, py - p.h/2, p.w, p.h); ctx.strokeRect(px - p.w/2, py - p.h/2, p.w, p.h); }
        }

        ctx.fillStyle = "#ffcc00";
        bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill(); });
        if (placedGear) { ctx.font = "50px Arial"; ctx.fillText("⚙️", placedGear.x, placedGear.y + 15); }

        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.life -= 0.02;
            ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); if(p.life <= 0) particles.splice(i, 1);
        });
        ctx.globalAlpha = 1;

        floatingTexts.forEach((t, i) => {
            ctx.globalAlpha = t.life; ctx.fillStyle = t.color; ctx.font = "bold 22px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(t.text, t.x, t.y); t.y -= 1.2; t.life -= 0.015; if(t.life <= 0) floatingTexts.splice(i, 1);
        });
        ctx.globalAlpha = 1;

        goldDisplay.innerText = Math.floor(gold).toLocaleString(); // UI 골드 업데이트
        update();
        requestAnimationFrame(draw);
    }

    updateUI();
    draw();
</script>
</body>
</html>
