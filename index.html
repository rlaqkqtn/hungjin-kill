<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ragdoll Clicker - New Weapons</title>
    <style>
        body { margin: 0; background-color: #1a1a1b; color: white; font-family: 'Pretendard', sans-serif; overflow: hidden; user-select: none; cursor: crosshair; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 100; }
        .stat-container { background: rgba(0, 0, 0, 0.85); padding: 15px; border-radius: 12px; border-left: 5px solid #ffcc00; min-width: 220px; }
        .stat { font-size: 24px; margin-bottom: 5px; color: #fff; font-weight: bold; }
        #hp-bar-container { width: 100%; height: 12px; background: #333; border-radius: 6px; overflow: hidden; margin-top: 10px; border: 1px solid #555; }
        #hp-inner { width: 100%; height: 100%; background: linear-gradient(90deg, #ff4444, #ff8888); transition: width 0.2s; }
        
        .menu-wrapper { position: absolute; right: 0; top: 0; height: 100vh; display: flex; align-items: center; z-index: 200; }
        .side-menu { background: rgba(30, 30, 35, 0.98); width: 280px; height: 100vh; padding: 20px; border-left: 2px solid #444; box-sizing: border-box; display: none; }
        .side-menu.active { display: block; }
        .tab-container { display: flex; flex-direction: column; gap: 5px; }
        .menu-toggle { background: #ffcc00; color: #000; padding: 20px 10px; cursor: pointer; border-radius: 10px 0 0 10px; font-weight: bold; writing-mode: vertical-lr; border: none; font-size: 14px; }
        
        button { width: 100%; padding: 12px; margin: 6px 0; cursor: pointer; background: #3d3d40; color: white; border: 1px solid #555; font-size: 14px; font-weight: bold; border-radius: 8px; }
        .equipped { border: 2px solid #ffcc00 !important; color: #ffcc00 !important; }
        
        canvas { display: block; background: #252527; }
        #gold-rush-ui { position: absolute; top: 150px; left: 20px; display: none; background: #ffcc00; color: black; padding: 10px; font-weight: bold; border-radius: 5px; z-index: 100; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat-container">
        <div class="stat">골드: <span id="gold">0</span>G</div>
        <div style="font-size: 13px; color: #aaa;">형진이 방어력: Lv.<span id="doll-lv">1</span></div>
        <div id="hp-bar-container"><div id="hp-inner"></div></div>
    </div>
</div>

<div id="gold-rush-ui">💰 GOLD RUSH (x2)!</div>

<div class="menu-wrapper">
    <div class="tab-container">
        <button class="menu-toggle" onclick="toggleMenu('shop')">상 점</button>
        <button class="menu-toggle" style="background:#4caf50" onclick="toggleMenu('storage')">인벤토리</button>
    </div>
    <div id="shop" class="side-menu">
        <button onclick="upgradeAtk()">🔥 공격력 강화 (<span id="atk-cost">500</span>G)</button>
        <div id="shop-items"></div>
    </div>
    <div id="storage" class="side-menu">
        <div id="inventory-items"></div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let gold = 0, isDead = false, atkMultiplier = 1.0, upgradeCost = 500;
    let particles = [], floatingTexts = [], explosions = [], bullets = [];
    let mouseX = canvas.width/2, mouseY = canvas.height/2;
    let lastAttackTime = Date.now();
    let dollLv = 1;
    let clickHistory = [];
    let isGoldRush = false;
    let goldRushTimer = 0;

    // --- 무기 데이터 업데이트 ---
    const weapons = {
        punch: { name: '기본 주먹', emoji: '👊', dmg: 20, price: 0, owned: true },
        poison: { name: '독극물', emoji: '🧪', dmg: 15, price: 1500, owned: false, isPoison: true },
        gun: { name: '권총', emoji: '🔫', dmg: 100, price: 6000, owned: false, isGun: true },
        gear: { name: '톱니바퀴', emoji: '⚙️', dmg: 60, price: 10000, owned: false, isPlaced: true },
        fire: { name: '화염구', emoji: '🔥', dmg: 350, price: 25000, owned: false, isFire: true },
        bomb: { name: '폭탄', emoji: '💣', dmg: 2000, price: 60000, owned: false, isExplosive: true }
    };
    let currentWeapon = 'punch';
    let placedGear = null;

    let doll = {
        x: canvas.width / 2, y: canvas.height / 2, vx: 0, vy: 0, 
        charred: 0, poisonStacks: 0,
        parts: {
            head: { rx: 0, ry: -120, r: 45, hp: 150, max: 150, active: true },
            body: { rx: 0, ry: 0, w: 100, h: 140, hp: 500, max: 500, active: true },
            armL: { rx: -85, ry: -20, w: 35, h: 110, hp: 100, max: 100, active: true },
            armR: { rx: 85, ry: -20, w: 35, h: 110, hp: 100, max: 100, active: true },
            legL: { rx: -30, ry: 130, w: 40, h: 120, hp: 130, max: 130, active: true },
            legR: { rx: 30, ry: 130, w: 40, h: 120, hp: 130, max: 130, active: true }
        }
    };

    // --- 1. 피격 대사 추가 ---
    const screams = ["아야!", "형진이 아파!", "그만해!", "악!", "난 게이일 뿐이야", "너무해!", "멈춰줘!"];
    const taunts = ["간지러운데?", "고작 그정도?", "졸려..", "ㅋ", "안맞쥬?"];

    function toggleMenu(id) {
        const menus = document.querySelectorAll('.side-menu');
        menus.forEach(m => m.id === id ? m.classList.toggle('active') : m.classList.remove('active'));
    }

    function updateUI() {
        const shop = document.getElementById('shop-items');
        const inv = document.getElementById('inventory-items');
        shop.innerHTML = ''; inv.innerHTML = '';
        for (let id in weapons) {
            const w = weapons[id];
            const btn = document.createElement('button');
            btn.innerHTML = `${w.emoji} ${w.name} ${w.owned ? '' : '('+w.price+'G)'}`;
            if (w.owned) {
                btn.className = id === currentWeapon ? 'equipped' : '';
                btn.onclick = () => { currentWeapon = id; updateUI(); };
                inv.appendChild(btn);
            } else {
                btn.onclick = () => { if(gold >= w.price) { gold -= w.price; w.owned = true; updateUI(); } };
                shop.appendChild(btn);
            }
        }
        document.getElementById('gold').innerText = Math.floor(gold);
        document.getElementById('atk-cost').innerText = upgradeCost;
    }

    function upgradeAtk() {
        if (gold >= upgradeCost) {
            gold -= upgradeCost;
            atkMultiplier += 1.0;
            upgradeCost *= 2;
            updateUI();
        }
    }

    function spawnText(x, y, text, color) {
        floatingTexts.push({ x, y, text, color, life: 1.0 });
    }

    function applyDamage(key, dmg, x, y, isAuto = false) {
        if (isDead || !doll.parts[key].active) return;
        
        lastAttackTime = Date.now();
        const part = doll.parts[key];
        const finalDmg = dmg * atkMultiplier;
        part.hp -= finalDmg;

        let g = finalDmg * 1.5;
        if (isGoldRush) g *= 2;
        gold += g;

        // 물리 반동
        let ang = Math.atan2(doll.y + part.ry - y, doll.x + part.rx - x);
        doll.vx += Math.cos(ang) * (isAuto ? 2 : 10);
        doll.vy += Math.sin(ang) * (isAuto ? 2 : 10);

        if (weapons[currentWeapon].isFire) doll.charred = Math.min(1, doll.charred + 0.05);
        
        // --- 2. 독 시스템 (도트 데미지 중첩) ---
        if (weapons[currentWeapon].isPoison) {
            doll.poisonStacks = Math.min(50, doll.poisonStacks + 2);
        }

        if (part.hp <= 0) {
            if (key === 'body') {
                isDead = true;
                spawnText(doll.x, doll.y, "형진이 KO!", "#ff0000");
                setTimeout(respawn, 1500);
            } else {
                part.active = false;
            }
        }

        if (!isAuto && Math.random() < 0.3) {
            spawnText(doll.x, doll.y - 150, screams[Math.floor(Math.random()*screams.length)], "#ff4444");
        }
        createBlood(x, y, isAuto ? 2 : 10);
    }

    function respawn() {
        isDead = false;
        dollLv++;
        document.getElementById('doll-lv').innerText = dollLv;
        doll.x = canvas.width / 2; doll.y = canvas.height / 2;
        doll.vx = 0; doll.vy = 0; doll.charred = 0; doll.poisonStacks = 0;
        for (let k in doll.parts) {
            doll.parts[k].max *= 1.3;
            doll.parts[k].hp = doll.parts[k].max;
            doll.parts[k].active = true;
        }
    }

    function createBlood(x, y, count) {
        for(let i=0; i<count; i++) {
            particles.push({x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 1, r: Math.random()*3+2, color: doll.poisonStacks > 5 ? "#44ff44" : "#ff0000"});
        }
    }

    canvas.addEventListener('mousedown', (e) => {
        if (e.clientX > canvas.width - 300) return;
        
        const now = Date.now();
        clickHistory.push(now);
        clickHistory = clickHistory.filter(t => now - t < 1000);
        if (clickHistory.length >= 10 && !isGoldRush) {
            isGoldRush = true; goldRushTimer = 300;
            document.getElementById('gold-rush-ui').style.display = 'block';
        }

        // --- 2. 총 무기 로직 (투사체 생성) ---
        if (weapons[currentWeapon].isGun) {
            const angle = Math.atan2(doll.y - e.clientY, doll.x - e.clientX);
            bullets.push({
                x: e.clientX, y: e.clientY,
                vx: Math.cos(angle) * 25,
                vy: Math.sin(angle) * 25,
                dmg: weapons.gun.dmg
            });
            return;
        }

        if (weapons[currentWeapon].isPlaced) {
            placedGear = { x: e.clientX, y: e.clientY, lastHit: 0 };
            return;
        }

        for (let k in doll.parts) {
            const p = doll.parts[k];
            if (!p.active) continue;
            const px = doll.x + p.rx, py = doll.y + p.ry;
            const hit = p.r ? Math.hypot(e.clientX - px, e.clientY - py) < p.r :
                             (e.clientX > px - p.w/2 && e.clientX < px + p.w/2 && e.clientY > py - p.h/2 && e.clientY < py + p.h/2);
            if (hit) {
                applyDamage(k, weapons[currentWeapon].dmg, e.clientX, e.clientY);
                if(weapons[currentWeapon].isExplosive) explosions.push({x: e.clientX, y: e.clientY, r: 10, life: 1});
                break;
            }
        }
    });

    function update() {
        if (!isDead) {
            doll.vy += 0.5;
            doll.x += doll.vx; doll.y += doll.vy;
            doll.vx *= 0.95; doll.vy *= 0.95;

            // 도트 데미지 처리 (독)
            if (doll.poisonStacks > 0) {
                applyDamage('body', doll.poisonStacks * 0.1, doll.x, doll.y, true);
                doll.poisonStacks -= 0.05;
            }

            if (doll.x < 100) { doll.x = 100; doll.vx *= -0.5; }
            if (doll.x > canvas.width - 350) { doll.x = canvas.width - 350; doll.vx *= -0.5; }
            if (doll.y > canvas.height - 150) { doll.y = canvas.height - 150; doll.vy *= -0.5; }

            if (Date.now() - lastAttackTime > 3000 && Math.random() < 0.01) {
                spawnText(doll.x, doll.y - 150, taunts[Math.floor(Math.random()*taunts.length)], "#ffffff");
                lastAttackTime = Date.now();
            }
        }

        // --- 2. 총알 물리 및 충돌 처리 ---
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx; b.y += b.vy;
            
            for (let k in doll.parts) {
                const p = doll.parts[k];
                if (!p.active) continue;
                const px = doll.x + p.rx, py = doll.y + p.ry;
                const hit = p.r ? Math.hypot(b.x - px, b.y - py) < p.r :
                                 (b.x > px - p.w/2 && b.x < px + p.w/2 && b.y > py - p.h/2 && b.y < py + p.h/2);
                if (hit) {
                    applyDamage(k, b.dmg, b.x, b.y);
                    bullets.splice(i, 1);
                    break;
                }
            }
            if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(i, 1);
        }

        if (isGoldRush) {
            goldRushTimer--;
            if (goldRushTimer <= 0) { isGoldRush = false; document.getElementById('gold-rush-ui').style.display = 'none'; }
        }

        if (placedGear && weapons[currentWeapon].isPlaced) {
            if (Date.now() - placedGear.lastHit > 500) {
                for(let k in doll.parts) {
                    if(!doll.parts[k].active) continue;
                    const d = Math.hypot(placedGear.x - (doll.x + doll.parts[k].rx), placedGear.y - (doll.y + doll.parts[k].ry));
                    if (d < 100) { applyDamage(k, weapons.gear.dmg, placedGear.x, placedGear.y, true); placedGear.lastHit = Date.now(); break; }
                }
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 인형 렌더링
        for (let k in doll.parts) {
            const p = doll.parts[k];
            if (!p.active) continue;
            const px = doll.x + p.rx, py = doll.y + p.ry;
            
            let r = 224 - (doll.charred * 180), g = 172 - (doll.charred * 150), b = 105 - (doll.charred * 90);
            if (doll.poisonStacks > 10) { g += 50; r -= 30; b -= 30; } // 중독 시 초록색 효과
            
            ctx.fillStyle = isDead ? "#444" : `rgb(${r},${g},${b})`;
            ctx.strokeStyle = "#000"; ctx.lineWidth = 3;

            if (p.r) {
                ctx.beginPath(); ctx.arc(px, py, p.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                if (k === 'head') {
                    ctx.fillStyle = "white"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "center";
                    ctx.fillText("형진이", px, py - 60);
                    ctx.fillStyle = "#000";
                    if (!isDead) {
                        ctx.fillRect(px-15, py-10, 4, 4); ctx.fillRect(px+11, py-10, 4, 4);
                        ctx.beginPath(); ctx.arc(px, py+10, 10, 0, Math.PI); ctx.stroke();
                    } else {
                        ctx.font = "bold 20px sans-serif"; ctx.fillText("X X", px, py);
                    }
                }
            } else {
                ctx.fillRect(px - p.w/2, py - p.h/2, p.w, p.h);
                ctx.strokeRect(px - p.w/2, py - p.h/2, p.w, p.h);
            }
        }

        // 총알 그리기
        ctx.fillStyle = "#ffcc00";
        bullets.forEach(b => {
            ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
        });

        if (placedGear) { ctx.font = "50px Arial"; ctx.fillText("⚙️", placedGear.x, placedGear.y + 15); }

        explosions.forEach((e, i) => {
            ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
            ctx.fillStyle = `rgba(255,100,0,${e.life})`; ctx.fill();
            e.r += 5; e.life -= 0.05;
            if(e.life <= 0) explosions.splice(i, 1);
        });

        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.life -= 0.02;
            ctx.fillStyle = p.color || "red"; ctx.globalAlpha = p.life;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            if(p.life <= 0) particles.splice(i, 1);
        });
        ctx.globalAlpha = 1;

        floatingTexts.forEach((t, i) => {
            ctx.globalAlpha = t.life; ctx.fillStyle = t.color; ctx.font = "bold 25px sans-serif";
            ctx.fillText(t.text, t.x, t.y); t.y -= 1; t.life -= 0.02;
            if(t.life <= 0) floatingTexts.splice(i, 1);
        });
        ctx.globalAlpha = 1;

        // 마우스 무기
        ctx.font = "60px Arial";
        ctx.fillText(weapons[currentWeapon].emoji, mouseX - 30, mouseY + 30);

        document.getElementById('gold').innerText = Math.floor(gold);
        document.getElementById('hp-inner').style.width = (doll.parts.body.hp / doll.parts.body.max * 100) + "%";
        update();
        requestAnimationFrame(draw);
    }

    updateUI();
    draw();
</script>
</body>
</html>
