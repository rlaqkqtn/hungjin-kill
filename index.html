<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ragdoll Clicker - Yumi & Storage Edition</title>
    <style>
        body { margin: 0; background-color: #1a1a1b; color: white; font-family: 'Pretendard', sans-serif; overflow: hidden; user-select: none; cursor: crosshair; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; }
        .stat-container { background: rgba(0, 0, 0, 0.8); padding: 15px; border-radius: 12px; border-left: 5px solid #ffcc00; min-width: 220px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .stat { font-size: 24px; margin-bottom: 5px; color: #fff; font-weight: bold; }
        #hp-bar-container { width: 100%; height: 12px; background: #333; border-radius: 6px; overflow: hidden; margin-top: 10px; border: 1px solid #555; }
        #hp-inner { width: 100%; height: 100%; background: linear-gradient(90deg, #ff4444, #ff8888); transition: width 0.2s; }
        
        /* 슬라이드 메뉴 공통 */
        .side-menu { position: absolute; right: -320px; top: 0; background: rgba(30, 30, 35, 0.98); width: 280px; height: 100vh; transition: 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.2); padding: 20px; z-index: 99; border-left: 2px solid #444; box-sizing: border-box; }
        .side-menu.open { right: 0; }
        .menu-toggle { position: absolute; right: 0; background: #ffcc00; color: #000; padding: 15px 10px; cursor: pointer; border-radius: 10px 0 0 10px; font-weight: bold; z-index: 100; writing-mode: vertical-lr; border: none; }
        
        #shop-toggle { top: 20%; }
        #storage-toggle { top: 50%; background: #4caf50; }

        .menu-title { margin: 15px 0 10px 0; color: #ffcc00; font-size: 20px; text-align: center; font-weight: bold; border-bottom: 1px solid #555; padding-bottom: 5px; }
        button { width: 100%; padding: 12px; margin: 6px 0; cursor: pointer; background: #3d3d40; color: white; border: 1px solid #555; font-size: 14px; font-weight: bold; border-radius: 8px; transition: 0.2s; }
        button:hover:not(:disabled) { background: #505055; border-color: #ffcc00; }
        button:disabled { opacity: 0.5; cursor: default; background: #222; }
        .equipped { border: 2px solid #ffcc00 !important; color: #ffcc00 !important; background: #444; }

        #equipped-info { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 25px; border-radius: 30px; font-weight: bold; color: #ffcc00; border: 1px solid #ffcc00; }
        canvas { background: #252527; display: block; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat-container">
        <div class="stat">골드: <span id="gold">0</span>G</div>
        <div style="font-size: 13px; color: #aaa;">인형 레벨: Lv.<span id="doll-lv">1</span></div>
        <div id="hp-bar-container"><div id="hp-inner"></div></div>
    </div>
</div>

<!-- 상점 메뉴 -->
<button id="shop-toggle" class="menu-toggle" onclick="toggleMenu('shop')">S H O P ▶</button>
<div id="shop" class="side-menu">
    <div class="menu-title">🛒 상점</div>
    <button onclick="upgradeAtk()">공격력 강화 (<span id="atk-cost">500</span>G)</button>
    <div id="shop-items"></div>
</div>

<!-- 보관함 메뉴 -->
<button id="storage-toggle" class="menu-toggle" onclick="toggleMenu('storage')">I N V E N T O R Y ▶</button>
<div id="storage" class="side-menu">
    <div class="menu-title">📦 보관함</div>
    <div id="inventory-items"></div>
</div>

<div id="equipped-info">장착: <span id="current-weapon-txt">👊 기본 주먹</span></div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let gold = 0, isDead = false, atkMultiplier = 1.0, upgradeCost = 500;
    let particles = [], floatingTexts = [], explosionEffects = [];
    let placedGear = null, mouseX = 0, mouseY = 0;
    let lastAttackTime = Date.now();
    let dollLv = 1;

    // 무기 데이터 (유미 추가, 밸런스 조정)
    const weaponData = {
        punch: { name: '기본 주먹', emoji: '👊', dmg: 20, price: 0, owned: true },
        yumi: { name: '유미', emoji: '🐱', dmg: 55, price: 800, owned: false },
        dagger: { name: '단검', emoji: '🗡️', dmg: 80, price: 2000, owned: false },
        gear: { name: '톱니바퀴', emoji: '⚙️', dmg: 40, price: 3500, owned: false, isPlaced: true },
        fire: { name: '화염구', emoji: '🔥', dmg: 150, price: 8000, owned: false },
        bomb: { name: '폭탄', emoji: '💣', dmg: 800, price: 20000, owned: false, isExplosive: true }
    };
    let currentId = 'punch';

    let doll = {
        x: canvas.width / 2, y: canvas.height / 2, vx: 0, vy: 0, burnLevel: 0,
        parts: {
            head: { rx: 0, ry: -120, r: 45, hp: 150, max: 150 },
            body: { rx: 0, ry: 0, w: 100, h: 140, hp: 400, max: 400 },
            armL: { rx: -85, ry: -20, w: 35, h: 110, hp: 100, max: 100 },
            armR: { rx: 85, ry: -20, w: 35, h: 110, hp: 100, max: 100 }
        }
    };

    const screams = ["아야", "그만해", "dont do that", "정말 고통스러운!", "때리지마 난 게이일 뿐이라고"];
    const taunts = ["뭐해?", "ez", "ㅋ", "졸려..", "안아픈데?", "더 세게 해봐"];

    function toggleMenu(menuId) {
        document.getElementById('shop').classList.remove('open');
        document.getElementById('storage').classList.remove('open');
        if(menuId) document.getElementById(menuId).classList.add('open');
    }

    function updateMenus() {
        const shopDiv = document.getElementById('shop-items');
        const invDiv = document.getElementById('inventory-items');
        shopDiv.innerHTML = ''; invDiv.innerHTML = '';

        for (let id in weaponData) {
            const w = weaponData[id];
            if (!w.owned) {
                const btn = document.createElement('button');
                btn.innerHTML = `${w.emoji} ${w.name}<br>(${w.price}G)`;
                btn.onclick = () => buyWeapon(id);
                shopDiv.appendChild(btn);
            } else {
                const btn = document.createElement('button');
                btn.innerHTML = `${w.emoji} ${w.name}`;
                btn.className = (id === currentId) ? 'equipped' : '';
                btn.onclick = () => selectWeapon(id);
                invDiv.appendChild(btn);
            }
        }
    }

    function buyWeapon(id) {
        if (gold >= weaponData[id].price) {
            gold -= weaponData[id].price;
            weaponData[id].owned = true;
            updateMenus();
            spawnText(canvas.width/2, canvas.height/2, "구매 완료! 보관함을 확인하세요", "#ffcc00");
        }
    }

    function selectWeapon(id) {
        currentId = id;
        document.getElementById('current-weapon-txt').innerText = `${weaponData[id].emoji} ${weaponData[id].name}`;
        updateMenus();
    }

    function upgradeAtk() {
        if (gold >= upgradeCost) {
            gold -= upgradeCost;
            atkMultiplier += 0.5;
            upgradeCost = Math.floor(upgradeCost * 1.8);
            document.getElementById('atk-cost').innerText = upgradeCost;
            document.getElementById('atk-mult').innerText = atkMultiplier.toFixed(1);
        }
    }

    function applyDamage(partKey, amount, x, y, effectType) {
        if (isDead) return;
        lastAttackTime = Date.now();
        const part = doll.parts[partKey];
        const finalDamage = amount * atkMultiplier;
        part.hp -= finalDamage;
        
        // --- 5. 인형이 단단할수록(레벨 높을수록) 골드 추가 획득 ---
        const goldGain = (finalDamage * 1.5) * (1 + (dollLv * 0.1));
        gold += goldGain;

        if (weaponData[currentId].isExplosive) {
            explosionEffects.push({x, y, r: 10, maxR: 150, life: 1});
            createBlood(x, y, 50);
        } else {
            createBlood(x, y, 8);
        }

        if (Math.random() < 0.3) spawnText(doll.x, doll.y - 180, screams[Math.floor(Math.random()*screams.length)], "#ff4444");
        if (partKey === 'body' && part.hp <= 0) die();
    }

    function die() {
        if (isDead) return;
        isDead = true;
        spawnText(doll.x, doll.y, "K.O.", "#ff0000");
        setTimeout(() => {
            isDead = false;
            dollLv++;
            document.getElementById('doll-lv').innerText = dollLv;
            // --- 6. 정중앙 부활 ---
            doll.x = canvas.width / 2;
            doll.y = canvas.height / 2;
            doll.vx = 0; doll.vy = 0;
            Object.values(doll.parts).forEach(p => { 
                p.max = Math.floor(p.max * 1.3); 
                p.hp = p.max; 
            });
        }, 1500);
    }

    canvas.addEventListener('mousedown', (e) => {
        if (e.clientX > canvas.width - 280 && (document.getElementById('shop').classList.contains('open') || document.getElementById('storage').classList.contains('open'))) return;
        
        const weapon = weaponData[currentId];
        if (weapon.isPlaced) {
            placedGear = { x: e.clientX, y: e.clientY, emoji: weapon.emoji, dmg: weapon.dmg, lastHit: 0 };
            return;
        }

        for (let key in doll.parts) {
            const p = doll.parts[key];
            const px = doll.x + p.rx, py = doll.y + p.ry;
            let hit = (p.r) ? Math.sqrt((mouseX-px)**2 + (mouseY-py)**2) < p.r : 
                             (mouseX > px - p.w/2 && mouseX < px + p.w/2 && mouseY > py - p.h/2 && mouseY < py + p.h/2);
            if (hit) {
                applyDamage(key, weapon.dmg, mouseX, mouseY);
                break;
            }
        }
    });

    window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const now = Date.now();

        // --- 3. 1초 동안 공격 안하면 도발 ---
        if (!isDead && now - lastAttackTime > 1500) {
            if (Math.random() < 0.02) {
                spawnText(doll.x, doll.y - 180, taunts[Math.floor(Math.random()*taunts.length)], "#ffffff");
                lastAttackTime = now; 
            }
        }

        if(!isDead) {
            let dx = doll.x - mouseX, dy = doll.y - mouseY;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < 300) { doll.vx += (dx/dist)*0.3; doll.vy += (dy/dist)*0.3; }
            doll.x += doll.vx; doll.y += doll.vy;
            doll.vy += 0.5; doll.vx *= 0.95; doll.vy *= 0.95;
            doll.x = Math.max(100, Math.min(canvas.width - 100, doll.x));
            doll.y = Math.max(100, Math.min(canvas.height - 100, doll.y));
        }

        // 인형(웃는 얼굴 고정)
        for (let key in doll.parts) {
            const p = doll.parts[key];
            const px = doll.x + p.rx, py = doll.y + p.ry;
            ctx.fillStyle = (isDead) ? '#333' : '#e0ac69';
            ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
            if (p.r) {
                ctx.beginPath(); ctx.arc(px, py, p.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                if (key === 'head' && !isDead) {
                    ctx.fillStyle = '#000';
                    ctx.beginPath(); ctx.arc(px-15, py-8, 3, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(px+15, py-8, 3, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(px, py+10, 15, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
                }
            } else {
                ctx.fillRect(px - p.w/2, py - p.h/2, p.w, p.h);
                ctx.strokeRect(px - p.w/2, py - p.h/2, p.w, p.h);
            }
        }

        // 톱니바퀴
        if (placedGear) {
            ctx.font = '60px Arial';
            ctx.fillText(placedGear.emoji, placedGear.x - 30, placedGear.y + 30);
            if (now - placedGear.lastHit > 600) {
                for (let key in doll.parts) {
                    const p = doll.parts[key];
                    const d = Math.sqrt((placedGear.x - (doll.x + p.rx))**2 + (placedGear.y - (doll.y + p.ry))**2);
                    if (d < 90) { applyDamage(key, placedGear.dmg, placedGear.x, placedGear.y); placedGear.lastHit = now; break; }
                }
            }
        }

        // --- 4. 폭탄 임팩트 효과 ---
        explosionEffects.forEach((eff, i) => {
            ctx.beginPath();
            ctx.arc(eff.x, eff.y, eff.r, 0, Math.PI*2);
            ctx.fillStyle = `rgba(255, ${150 * eff.life}, 0, ${eff.life})`;
            ctx.fill();
            eff.r += 10; eff.life -= 0.05;
            if(eff.life <= 0) explosionEffects.splice(i, 1);
        });

        // 커서 무기
        if (!weaponData[currentId].isPlaced) {
            ctx.font = '70px Arial';
            ctx.fillText(weaponData[currentId].emoji, mouseX - 35, mouseY + 35);
        }

        // UI/텍스트/파티클
        floatingTexts.forEach((t, i) => {
            ctx.globalAlpha = t.life; ctx.fillStyle = t.color; ctx.font = 'bold 26px Pretendard';
            ctx.textAlign = 'center'; ctx.fillText(t.text, t.x, t.y); t.y -= 1.2; t.life -= 0.015;
            if(t.life <= 0) floatingTexts.splice(i, 1);
        });
        ctx.textAlign = 'left'; ctx.globalAlpha = 1;
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life -= 0.02;
            ctx.fillStyle = `rgba(220,20,20,${p.life})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            if(p.life <= 0) particles.splice(i, 1);
        });

        document.getElementById('gold').innerText = Math.floor(gold);
        document.getElementById('hp-inner').style.width = (doll.parts.body.hp / doll.parts.body.max * 100) + "%";
        requestAnimationFrame(render);
    }

    function spawnText(x, y, text, color) { floatingTexts.push({ x, y, text, life: 1, color }); }
    function createBlood(x, y, amount) {
        for(let i=0; i<amount; i++) particles.push({ x, y, vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12, r: Math.random()*5+2, life: 1 });
    }

    updateMenus();
    render();
</script>
</body>
</html>
