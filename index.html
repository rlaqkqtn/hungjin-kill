<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ragdoll Clicker - Full Recovery</title>
    <style>
        body { margin: 0; background-color: #1a1a1b; color: white; font-family: 'Pretendard', sans-serif; overflow: hidden; user-select: none; cursor: crosshair; }
        
        /* UI 레이아웃 */
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; }
        .stat-container { background: rgba(0, 0, 0, 0.8); padding: 15px; border-radius: 12px; border-left: 5px solid #ffcc00; min-width: 220px; }
        .stat { font-size: 24px; margin-bottom: 5px; color: #fff; font-weight: bold; }
        #hp-bar-container { width: 100%; height: 12px; background: #333; border-radius: 6px; overflow: hidden; margin-top: 10px; border: 1px solid #555; }
        #hp-inner { width: 100%; height: 100%; background: linear-gradient(90deg, #ff4444, #ff8888); transition: width 0.2s; }
        
        /* 골드러쉬 알림 */
        #gold-rush-ui { position: absolute; top: 150px; left: 20px; display: none; background: linear-gradient(45deg, #ffcc00, #ff8800); color: black; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 20px; animation: blink 0.5s infinite; z-index: 5; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* 오른쪽 메뉴 */
        .menu-wrapper { position: absolute; right: 0; top: 0; height: 100vh; display: flex; align-items: center; z-index: 100; }
        .side-menu { background: rgba(30, 30, 35, 0.98); width: 280px; height: 100vh; padding: 20px; border-left: 2px solid #444; box-sizing: border-box; display: none; }
        .side-menu.active { display: block; }
        
        .tab-container { display: flex; flex-direction: column; gap: 5px; }
        .menu-toggle { background: #ffcc00; color: #000; padding: 20px 10px; cursor: pointer; border-radius: 10px 0 0 10px; font-weight: bold; writing-mode: vertical-lr; border: none; font-size: 14px; }
        #storage-tab { background: #4caf50; }

        button { width: 100%; padding: 12px; margin: 6px 0; cursor: pointer; background: #3d3d40; color: white; border: 1px solid #555; font-size: 14px; font-weight: bold; border-radius: 8px; transition: 0.2s; }
        button:hover:not(:disabled) { background: #505055; border-color: #ffcc00; }
        .equipped { border: 2px solid #ffcc00 !important; color: #ffcc00 !important; background: #444; }

        #equipped-info { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 25px; border-radius: 30px; font-weight: bold; color: #ffcc00; border: 1px solid #ffcc00; pointer-events: none; }
        canvas { background: #252527; display: block; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat-container">
        <div class="stat">골드: <span id="gold">0</span>G</div>
        <div style="font-size: 13px; color: #aaa;">형진이 방어력: Lv.<span id="doll-lv">1</span></div>
        <div id="hp-bar-container"><div id="hp-inner"></div></div>
    </div>
</div>

<div id="gold-rush-ui">💰 GOLD RUSH (x2)!</div>

<div class="menu-wrapper">
    <div class="tab-container">
        <button class="menu-toggle" onclick="toggleMenu('shop')">상 점</button>
        <button class="menu-toggle" id="storage-tab" onclick="toggleMenu('storage')">인벤토리</button>
    </div>
    <div id="shop" class="side-menu">
        <div style="text-align:center; color:#ffcc00; font-weight:bold; margin-bottom:10px;">🛒 무기 상점</div>
        <button onclick="upgradeAtk()">🔥 공격력 강화 (<span id="atk-cost">500</span>G)</button>
        <div id="shop-items"></div>
    </div>
    <div id="storage" class="side-menu">
        <div style="text-align:center; color:#4caf50; font-weight:bold; margin-bottom:10px;">📦 보관함</div>
        <div id="inventory-items"></div>
    </div>
</div>

<div id="equipped-info">장착 무기: <span id="current-weapon-txt">👊 기본 주먹</span></div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let gold = 0, isDead = false, atkMultiplier = 1.0, upgradeCost = 500;
    let particles = [], floatingTexts = [], explosionEffects = [];
    let mouseX = canvas.width/2, mouseY = canvas.height/2; // 마우스 초기값
    let lastAttackTime = Date.now();
    let dollLv = 1;

    let clickHistory = [];
    let isGoldRush = false;
    let goldRushTimer = 0;

    const weaponData = {
        punch: { name: '기본 주먹', emoji: '👊', dmg: 20, price: 0, owned: true },
        yumi: { name: '유미', emoji: '🐱', dmg: 75, price: 800, owned: false },
        dagger: { name: '단검', emoji: '🗡️', dmg: 120, price: 2500, owned: false },
        gear: { name: '톱니바퀴', emoji: '⚙️', dmg: 60, price: 5000, owned: false, isPlaced: true },
        fire: { name: '화염구', emoji: '🔥', dmg: 280, price: 12000, owned: false, isFire: true },
        bomb: { name: '폭탄', emoji: '💣', dmg: 1500, price: 30000, owned: false, isExplosive: true }
    };
    let currentId = 'punch';
    let placedGear = null;

    let doll = {
        x: canvas.width / 2, y: canvas.height / 2, vx: 0, vy: 0,
        charred: 0,
        parts: {
            head: { rx: 0, ry: -120, r: 45, hp: 150, max: 150, active: true },
            body: { rx: 0, ry: 0, w: 100, h: 140, hp: 500, max: 500, active: true },
            armL: { rx: -85, ry: -20, w: 35, h: 110, hp: 100, max: 100, active: true },
            armR: { rx: 85, ry: -20, w: 35, h: 110, hp: 100, max: 100, active: true },
            legL: { rx: -30, ry: 130, w: 40, h: 120, hp: 130, max: 130, active: true },
            legR: { rx: 30, ry: 130, w: 40, h: 120, hp: 130, max: 130, active: true }
        }
    };

    // --- 2. 대사 목록 복구 ---
    const screams = ["아야!", "형진이 아파!", "그만해!", "Don't do that!", "때리지마 난 게이일 뿐이라고"];
    const taunts = ["간지러운데?", "ez", "ㅋ", "졸려..", "뭐해?"];

    function toggleMenu(menuId) {
        const target = document.getElementById(menuId);
        const alreadyActive = target.classList.contains('active');
        document.querySelectorAll('.side-menu').forEach(m => m.classList.remove('active'));
        if(!alreadyActive) target.classList.add('active');
    }

    function updateMenus() {
        const shopDiv = document.getElementById('shop-items');
        const invDiv = document.getElementById('inventory-items');
        shopDiv.innerHTML = ''; invDiv.innerHTML = '';

        for (let id in weaponData) {
            const w = weaponData[id];
            if (!w.owned) {
                const btn = document.createElement('button');
                btn.innerHTML = `${w.emoji} ${w.name} (${w.price}G)`;
                btn.onclick = () => buyWeapon(id);
                shopDiv.appendChild(btn);
            } else {
                const btn = document.createElement('button');
                btn.innerHTML = `${w.emoji} ${w.name}`;
                btn.className = (id === currentId) ? 'equipped' : '';
                btn.onclick = () => selectWeapon(id);
                invDiv.appendChild(btn);
            }
        }
    }

    function buyWeapon(id) {
        if (gold >= weaponData[id].price) {
            gold -= weaponData[id].price;
            weaponData[id].owned = true;
            updateMenus();
        }
    }

    function selectWeapon(id) {
        currentId = id;
        if (!weaponData[id].isPlaced) placedGear = null;
        document.getElementById('current-weapon-txt').innerText = `${weaponData[id].emoji} ${weaponData[id].name}`;
        updateMenus();
    }

    function upgradeAtk() {
        if (gold >= upgradeCost) {
            gold -= upgradeCost;
            atkMultiplier += 1.0;
            upgradeCost *= 2;
            document.getElementById('atk-cost').innerText = upgradeCost;
        }
    }

    function applyDamage(partKey, amount, x, y, isAuto = false) {
        if (isDead || !doll.parts[partKey].active) return;
        
        lastAttackTime = Date.now(); // 공격 시간 갱신 (도발용)
        const part = doll.parts[partKey];
        const finalDamage = amount * atkMultiplier;
        part.hp -= finalDamage;
        
        // --- 물리 충격 적용 (맞으면 튕겨나감) ---
        let ang = Math.atan2(doll.y + part.ry - y, doll.x + part.rx - x);
        let force = isAuto ? 1 : 8; // 자동 공격은 약하게, 클릭은 강하게
        doll.vx += Math.cos(ang) * force;
        doll.vy += Math.sin(ang) * force;

        if (weaponData[currentId].isFire) {
            doll.charred = Math.min(1, doll.charred + 0.1);
        }

        let goldGain = (finalDamage * 1.6) * (1 + (dollLv * 0.1));
        if (isGoldRush) goldGain *= 2; 
        gold += goldGain;

        if (weaponData[currentId].isExplosive && !isAuto) {
            explosionEffects.push({x, y, r: 10, life: 1});
            createBlood(x, y, 40);
        } else {
            createBlood(x, y, 8);
        }

        if (part.hp <= 0) {
            if (partKey === 'body') die();
            else part.active = false;
        }

        // --- 2. 비명 대사 출력 복구 (클릭 시에만) ---
        if (!isAuto && Math.random() < 0.3) {
            spawnText(doll.x, doll.y - 200, screams[Math.floor(Math.random()*screams.length)], "#ff4444");
        }
    }

    function die() {
        if (isDead) return;
        isDead = true;
        spawnText(doll.x, doll.y, "형진이 KO!", "#ff0000");
        createBlood(doll.x, doll.y, 100);
        setTimeout(() => {
            isDead = false;
            dollLv++;
            document.getElementById('doll-lv').innerText = dollLv;
            doll.x = canvas.width / 2; doll.y = canvas.height / 2;
            doll.vx = 0; doll.vy = 0; doll.charred = 0;
            Object.values(doll.parts).forEach(p => { 
                p.max = Math.floor(p.max * 1.3); 
                p.hp = p.max; p.active = true;
            });
        }, 1500);
    }

    canvas.addEventListener('mousedown', (e) => {
        if (e.clientX > canvas.width - 300) return;
        
        const now = Date.now();
        clickHistory.push(now);
        clickHistory = clickHistory.filter(t => now - t < 1000);
        if (clickHistory.length >= 10 && !isGoldRush) activateGoldRush();

        const weapon = weaponData[currentId];
        if (weapon.isPlaced) {
            placedGear = { x: e.clientX, y: e.clientY, dmg: weapon.dmg, lastHit: 0 };
            return;
        }

        for (let key in doll.parts) {
            const p = doll.parts[key];
            if (!p.active) continue;
            const px = doll.x + p.rx, py = doll.y + p.ry;
            let hit = (p.r) ? Math.sqrt((mouseX-px)**2 + (mouseY-py)**2) < p.r : 
                             (mouseX > px - p.w/2 && mouseX < px + p.w/2 && mouseY > py - p.h/2 && mouseY < py + p.h/2);
            if (hit) {
                applyDamage(key, weapon.dmg, mouseX, mouseY);
                break;
            }
        }
    });

    function activateGoldRush() {
        isGoldRush = true;
        goldRushTimer = 300;
        document.getElementById('gold-rush-ui').style.display = 'block';
        spawnText(canvas.width/2, 200, "GOLD RUSH!!!", "#ffcc00");
    }

    window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const now = Date.now();

        if (isGoldRush) {
            goldRushTimer--;
            if (goldRushTimer <= 0) {
                isGoldRush = false;
                document.getElementById('gold-rush-ui').style.display = 'none';
            }
        }

        // --- 2. 도발 대사 복구 (2초간 공격 안하면 얄밉게 도발) ---
        if (!isDead && now - lastAttackTime > 2000) {
            if (Math.random() < 0.01) { // 프레임당 확률
                spawnText(doll.x, doll.y - 200, taunts[Math.floor(Math.random()*taunts.length)], "#ffffff");
                lastAttackTime = now; 
            }
        }

        // --- 1. 인형 물리 엔진 복구 (이 부분이 빠져있었습니다) ---
        if(!isDead) {
            // 중력 적용
            doll.vy += 0.5;
            
            // 마우스 피하기 AI (도망가기)
            let dx = doll.x - mouseX, dy = doll.y - mouseY;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if(dist < 250) {
                doll.vx += (dx/dist) * 0.4;
                doll.vy += (dy/dist) * 0.4;
            }

            // 좌표 갱신
            doll.x += doll.vx;
            doll.y += doll.vy;
            
            // 마찰력/저항
            doll.vx *= 0.96;
            doll.vy *= 0.96;
            
            // 벽 튕기기 (화면 이탈 방지)
            if (doll.x < 100) { doll.x = 100; doll.vx *= -0.5; }
            if (doll.x > canvas.width - 350) { doll.x = canvas.width - 350; doll.vx *= -0.5; }
            if (doll.y < 80) { doll.y = 80; doll.vy *= -0.3; }
            if (doll.y > canvas.height - 150) { doll.y = canvas.height - 150; doll.vy *= -0.4; }
        }

        // 인형 렌더링
        for (let key in doll.parts) {
            const p = doll.parts[key];
            if (!p.active) continue;
            const px = doll.x + p.rx, py = doll.y + p.ry;
            let r = 224 - (doll.charred * 180), g = 172 - (doll.charred * 150), b = 105 - (doll.charred * 90);
            ctx.fillStyle = isDead ? '#333' : `rgb(${r},${g},${b})`;
            ctx.strokeStyle = '#000'; ctx.lineWidth = 3;

            if (p.r) {
                ctx.beginPath(); ctx.arc(px, py, p.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                
                // --- 3. 머리 표정 및 이름 복구 ---
                if (key === 'head') {
                    // 이름
                    ctx.fillStyle = "white"; ctx.font = "bold 18px Pretendard"; ctx.textAlign = "center";
                    ctx.fillText("형진이", px, py - 60);

                    // --- 3. 표정 (눈, 입) ---
                    if (!isDead) {
                        ctx.fillStyle = "#000"; ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
                        // 눈
                        ctx.beginPath(); ctx.arc(px - 15, py - 10, 3, 0, Math.PI * 2); ctx.fill();
                        ctx.beginPath(); ctx.arc(px + 15, py - 10, 3, 0, Math.PI * 2); ctx.fill();
                        // 얄미운 웃음 입
                        ctx.beginPath(); ctx.arc(px, py + 8, 18, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
                    } else {
                        // 죽었을 때 표정 (X 눈)
                        ctx.strokeStyle = "#000"; ctx.lineWidth = 3;
                        ctx.beginPath(); ctx.moveTo(px-18, py-13); ctx.lineTo(px-8, py-3); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(px-18, py-3); ctx.lineTo(px-8, py-13); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(px+18, py-13); ctx.lineTo(px+8, py-3); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(px+18, py-3); ctx.lineTo(px+8, py-13); ctx.stroke();
                    }
                }
            } else {
                ctx.fillRect(px - p.w/2, py - p.h/2, p.w, p.h);
                ctx.strokeRect(px - p.w/2, py - p.h/2, p.w, p.h);
            }
        }

        // 톱니바퀴
        if (placedGear && weaponData[currentId].isPlaced) {
            ctx.font = '60px Arial'; ctx.textAlign = 'center';
            ctx.fillText('⚙️', placedGear.x, placedGear.y + 20);
            if (now - placedGear.lastHit > 500) {
                for (let key in doll.parts) {
                    const p = doll.parts[key];
                    if(!p.active) continue;
                    const d = Math.sqrt((placedGear.x - (doll.x + p.rx))**2 + (placedGear.y - (doll.y + p.ry))**2);
                    if (d < 100) { applyDamage(key, placedGear.dmg, placedGear.x, placedGear.y, true); placedGear.lastHit = now; break; }
                }
            }
        } else {
            placedGear = null;
        }

        // 이펙트/커서/텍스트
        explosionEffects.forEach((eff, i) => {
            ctx.beginPath(); ctx.arc(eff.x, eff.y, eff.r, 0, Math.PI*2);
            ctx.fillStyle = `rgba(255, ${100 * eff.life}, 0, ${eff.life})`; ctx.fill();
            eff.r += 10; eff.life -= 0.05;
            if(eff.life <= 0) explosionEffects.splice(i, 1);
        });

        if (!weaponData[currentId].isPlaced) {
            ctx.font = '70px Arial'; ctx.textAlign = 'left';
            ctx.fillText(weaponData[currentId].emoji, mouseX - 35, mouseY + 35);
        }

        floatingTexts.forEach((t, i) => {
            ctx.globalAlpha = t.life; ctx.fillStyle = t.color; ctx.font = 'bold 24px Pretendard';
            ctx.textAlign = 'center'; ctx.fillText(t.text, t.x, t.y); t.y -= 1.3; t.life -= 0.02;
            if(t.life <= 0) floatingTexts.splice(i, 1);
        });
        ctx.globalAlpha = 1;
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life -= 0.02;
            ctx.fillStyle = `rgba(200,20,20,${p.life})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            if(p.life <= 0) particles.splice(i, 1);
        });

        document.getElementById('gold').innerText = Math.floor(gold);
        document.getElementById('hp-inner').style.width = (doll.parts.body.hp / doll.parts.body.max * 100) + "%";
        requestAnimationFrame(render);
    }

    function spawnText(x, y, text, color) { floatingTexts.push({ x, y, text, life: 1, color }); }
    function createBlood(x, y, amount) {
        for(let i=0; i<amount; i++) particles.push({ x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, r: Math.random()*4+1, life: 1 });
    }

    updateMenus();
    render();
</script>
</body>
</html>
