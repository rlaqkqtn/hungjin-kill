<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ragdoll Clicker - UI & Gold Rush Fix</title>
    <style>
        body { margin: 0; background-color: #1a1a1b; color: white; font-family: 'Pretendard', sans-serif; overflow: hidden; user-select: none; cursor: none; }
        #custom-cursor { position: fixed; top: 0; left: 0; font-size: 60px; pointer-events: none; z-index: 999; transform: translate(-50%, -50%); will-change: transform; }
        
        /* UI 상단 정보 */
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 100; }
        .stat-container { background: rgba(0, 0, 0, 0.85); padding: 15px; border-radius: 12px; border-left: 5px solid #ffcc00; min-width: 250px; }
        .stat { font-size: 28px; margin-bottom: 5px; color: #ffcc00; font-weight: bold; }
        
        /* 체력바 디자인 개선 */
        #hp-bar-container { width: 100%; height: 16px; background: #333; border-radius: 8px; overflow: hidden; margin-top: 10px; border: 2px solid #555; position: relative; }
        #hp-inner { width: 100%; height: 100%; background: linear-gradient(90deg, #ff4444, #ff8888); transition: width 0.2s ease-out; position: absolute; z-index: 2; }
        #hp-bg { width: 100%; height: 100%; background: #900; position: absolute; z-index: 1; }

        /* 골드러쉬 UI */
        #gold-rush-ui { 
            position: absolute; top: 160px; left: 20px; display: none; 
            background: linear-gradient(45deg, #ffcc00, #ffae00); color: black; 
            padding: 12px 20px; font-weight: 900; border-radius: 8px; z-index: 100; 
            box-shadow: 0 0 30px #ffcc00; border: 2px solid white;
            animation: pulse 0.5s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* 메뉴 스타일 */
        .menu-wrapper { position: absolute; right: 0; top: 0; height: 100vh; display: flex; align-items: center; z-index: 200; cursor: default; }
        .side-menu { background: rgba(30, 30, 35, 0.98); width: 280px; height: 100vh; padding: 20px; border-left: 2px solid #444; box-sizing: border-box; display: none; overflow-y: auto; }
        .side-menu.active { display: block; }
        .tab-container { display: flex; flex-direction: column; gap: 5px; }
        .menu-toggle { background: #ffcc00; color: #000; padding: 20px 10px; cursor: pointer; border-radius: 10px 0 0 10px; font-weight: bold; writing-mode: vertical-lr; border: none; font-size: 14px; }
        
        button { width: 100%; padding: 12px; margin: 6px 0; cursor: pointer; background: #3d3d40; color: white; border: 1px solid #555; font-size: 14px; font-weight: bold; border-radius: 8px; }
        button:hover { background: #505055; }
        .equipped { border: 2px solid #ffcc00 !important; color: #ffcc00 !important; }
        canvas { display: block; background: #252527; }
    </style>
</head>
<body>

<div id="custom-cursor">👊</div>

<div id="ui">
    <div class="stat-container">
        <div class="stat">💰 <span id="gold">0</span></div>
        <div style="font-size: 13px; color: #aaa; margin-bottom: 5px;">형진이 방어 레벨: Lv.<span id="doll-lv">1</span></div>
        <div id="hp-bar-container">
            <div id="hp-inner"></div> <!-- 실제 체력 -->
            <div id="hp-bg"></div>    <!-- 배경 -->
        </div>
        <div style="font-size: 11px; color: #ff8888; margin-top: 4px; text-align: right;">TARGET HP</div>
    </div>
</div>

<div id="gold-rush-ui">🔥 GOLD RUSH (x3) 🔥</div>

<div class="menu-wrapper">
    <div class="tab-container">
        <button class="menu-toggle" onclick="toggleMenu('shop')">상 점</button>
        <button class="menu-toggle" style="background:#4caf50" onclick="toggleMenu('storage')">가방</button>
    </div>
    <div id="shop" class="side-menu">
        <button onclick="upgradeAtk()">🔥 내 근력 강화 (<span id="atk-cost">500</span>G)</button>
        <div id="shop-items"></div>
    </div>
    <div id="storage" class="side-menu">
        <div id="inventory-items"></div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const cursor = document.getElementById('custom-cursor');
    const goldDisplay = document.getElementById('gold');
    const hpInner = document.getElementById('hp-inner');
    const goldRushUI = document.getElementById('gold-rush-ui');

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let gold = 0, isDead = false, atkMultiplier = 1.0, upgradeCost = 500;
    let particles = [], floatingTexts = [], bullets = [];
    let dollLv = 1;
    let clickHistory = [];
    let isGoldRush = false, goldRushTimer = 0;
    let mouseX = 0, mouseY = 0;

    const weapons = {
        punch: { name: '기본 주먹', emoji: '👊', dmg: 20, price: 0, owned: true },
        yumi: { name: '유미', emoji: '🐱', dmg: 85, price: 500, owned: false },
        dagger: { name: '단검', emoji: '🗡️', dmg: 150, price: 1500, owned: false },
        gun: { name: '권총', emoji: '🔫', dmg: 200, price: 10000, owned: false, isGun: true },
        bomb: { name: '폭탄', emoji: '💣', dmg: 5000, price: 90000, owned: false, isExplosive: true }
    };
    let currentWeapon = 'punch';

    let doll = {
        x: canvas.width / 2, y: canvas.height / 2, vx: 0, vy: 0,
        parts: {
            body: { rx: 0, ry: 0, w: 100, h: 140, hp: 500, max: 500, active: true },
            head: { rx: 0, ry: -120, r: 45, hp: 200, max: 200, active: true }
        }
    };

    function toggleMenu(id) {
        const menus = document.querySelectorAll('.side-menu');
        menus.forEach(m => m.id === id ? m.classList.toggle('active') : m.classList.remove('active'));
    }

    function updateUI() {
        const shop = document.getElementById('shop-items');
        const inv = document.getElementById('inventory-items');
        shop.innerHTML = ''; inv.innerHTML = '';
        for (let id in weapons) {
            const w = weapons[id];
            const btn = document.createElement('button');
            btn.innerHTML = `${w.emoji} ${w.name} ${w.owned ? '' : '('+w.price+'G)'}`;
            if (w.owned) {
                btn.className = id === currentWeapon ? 'equipped' : '';
                btn.onclick = () => { currentWeapon = id; cursor.innerText = w.emoji; updateUI(); };
                inv.appendChild(btn);
            } else {
                btn.onclick = () => { if(gold >= w.price) { gold -= w.price; w.owned = true; updateUI(); } };
                shop.appendChild(btn);
            }
        }
        document.getElementById('atk-cost').innerText = upgradeCost;
    }

    // 체력바 업데이트 함수 (중요!)
    function updateHPBar() {
        const body = doll.parts.body;
        const hpPercent = Math.max(0, (body.hp / body.max) * 100);
        hpInner.style.width = hpPercent + "%";
    }

    function applyDamage(key, dmg, x, y) {
        if (isDead || !doll.parts[key].active) return;
        
        const part = doll.parts[key];
        const finalDmg = dmg * atkMultiplier;
        part.hp -= finalDmg;

        // 골드 획득 로직
        const earned = Math.floor(finalDmg * (isGoldRush ? 5 : 1.5));
        gold += earned;
        floatingTexts.push({ x: x, y: y, text: `+${earned}G`, color: isGoldRush ? "#fff" : "#ffcc00", life: 1.0 });

        // 체력바 즉시 갱신
        if (key === 'body') updateHPBar();

        // 넉백
        let ang = Math.atan2(doll.y - y, doll.x - x);
        doll.vx += Math.cos(ang) * 15;
        doll.vy += Math.sin(ang) * 15;

        if (doll.parts.body.hp <= 0) {
            isDead = true;
            gold += dollLv * 2000;
            floatingTexts.push({ x: doll.x, y: doll.y, text: `KO! +${dollLv * 2000}G`, color: "#ff4444", life: 2.0 });
            setTimeout(respawn, 1200);
        }
        createBlood(x, y, 5);
    }

    function respawn() {
        isDead = false; dollLv++;
        document.getElementById('doll-lv').innerText = dollLv;
        doll.vx = 0; doll.vy = 0;
        for (let k in doll.parts) {
            doll.parts[k].max *= 1.5;
            doll.parts[k].hp = doll.parts[k].max;
        }
        updateHPBar(); // 부활 시 체력바 풀충전
    }

    function createBlood(x, y, count) {
        for(let i=0; i<count; i++) {
            particles.push({x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 1, r: Math.random()*3+2});
        }
    }

    window.addEventListener('mousemove', (e) => { 
        mouseX = e.clientX; mouseY = e.clientY;
        cursor.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
    });

    canvas.addEventListener('mousedown', (e) => {
        if (e.clientX > canvas.width - 300) return;

        // 골드러쉬 시스템 (1초 내에 8번 클릭 시 발동)
        const now = Date.now();
        clickHistory.push(now);
        clickHistory = clickHistory.filter(t => now - t < 1000);
        
        if (clickHistory.length >= 8 && !isGoldRush) {
            isGoldRush = true;
            goldRushTimer = 300; // 약 5초
            goldRushUI.style.display = 'block';
        }

        if (weapons[currentWeapon].isGun) {
            const angle = Math.atan2(doll.y - mouseY, doll.x - mouseX);
            bullets.push({ x: mouseX, y: mouseY, vx: Math.cos(angle) * 25, vy: Math.sin(angle) * 25, dmg: weapons.gun.dmg });
            return;
        }

        // 인형 충돌 체크
        for (let k in doll.parts) {
            const p = doll.parts[k];
            const px = doll.x + p.rx, py = doll.y + p.ry;
            const hit = p.r ? Math.hypot(mouseX - px, mouseY - py) < p.r :
                             (mouseX > px - p.w/2 && mouseX < px + p.w/2 && mouseY > py - p.h/2 && mouseY < py + p.h/2);
            if (hit) {
                applyDamage(k, weapons[currentWeapon].dmg, mouseX, mouseY);
                break;
            }
        }
    });

    function upgradeAtk() {
        if (gold >= upgradeCost) {
            gold -= upgradeCost;
            atkMultiplier += 1.2;
            upgradeCost = Math.floor(upgradeCost * 2.2);
            updateUI();
        }
    }

    function update() {
        if (!isDead) {
            // 중앙 복귀력
            doll.vx += (canvas.width / 2 - doll.x) * 0.01;
            doll.vy += (canvas.height / 2 - doll.y) * 0.01;
            doll.x += doll.vx; doll.y += doll.vy;
            doll.vx *= 0.92; doll.vy *= 0.92;
        }

        // 총알 업데이트
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i]; b.x += b.vx; b.y += b.vy;
            if (Math.hypot(b.x - doll.x, b.y - doll.y) < 100) {
                applyDamage('body', b.dmg, b.x, b.y);
                bullets.splice(i, 1);
            }
            if (b && (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height)) bullets.splice(i, 1);
        }

        // 골드러쉬 타이머
        if (isGoldRush) {
            goldRushTimer--;
            if (goldRushTimer <= 0) {
                isGoldRush = false;
                goldRushUI.style.display = 'none';
            }
        }

        goldDisplay.innerText = Math.floor(gold).toLocaleString();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 인형 그리기
        for (let k in doll.parts) {
            const p = doll.parts[k]; if (!p.active) continue;
            ctx.fillStyle = isDead ? "#555" : "#e0ac69";
            ctx.strokeStyle = "#000"; ctx.lineWidth = 3;
            const px = doll.x + p.rx, py = doll.y + p.ry;
            if (p.r) {
                ctx.beginPath(); ctx.arc(px, py, p.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            } else {
                ctx.fillRect(px - p.w/2, py - p.h/2, p.w, p.h); ctx.strokeRect(px - p.w/2, py - p.h/2, p.w, p.h);
            }
        }

        // 파티클 & 텍스트
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.life -= 0.02;
            ctx.fillStyle = `rgba(255, 0, 0, ${p.life})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            if(p.life <= 0) particles.splice(i, 1);
        });

        floatingTexts.forEach((t, i) => {
            ctx.globalAlpha = t.life; ctx.fillStyle = t.color; ctx.font = "bold 24px sans-serif";
            ctx.fillText(t.text, t.x, t.y); t.y -= 1; t.life -= 0.02;
            if(t.life <= 0) floatingTexts.splice(i, 1);
        });
        ctx.globalAlpha = 1;

        update();
        requestAnimationFrame(draw);
    }

    updateUI();
    updateHPBar();
    draw();
</script>
</body>
</html>
