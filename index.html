<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ragdoll Clicker - Ultimate Fix</title>
    <style>
        body { margin: 0; background-color: #1a1a1b; color: white; font-family: 'Pretendard', sans-serif; overflow: hidden; user-select: none; cursor: none; }
        #custom-cursor { position: fixed; top: 0; left: 0; font-size: 60px; pointer-events: none; z-index: 999; transform: translate(-50%, -50%); will-change: transform; }
        
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 100; }
        .stat-container { background: rgba(0, 0, 0, 0.85); padding: 15px; border-radius: 12px; border-left: 5px solid #ffcc00; min-width: 250px; }
        .stat { font-size: 28px; margin-bottom: 5px; color: #ffcc00; font-weight: bold; }
        
        #hp-bar-container { width: 100%; height: 16px; background: #333; border-radius: 8px; overflow: hidden; margin-top: 10px; border: 2px solid #555; position: relative; }
        #hp-inner { width: 100%; height: 100%; background: linear-gradient(90deg, #ff4444, #ff8888); transition: width 0.1s ease-out; position: absolute; z-index: 2; }
        #hp-bg { width: 100%; height: 100%; background: #900; position: absolute; z-index: 1; }

        #gold-rush-ui { 
            position: absolute; top: 160px; left: 20px; display: none; 
            background: linear-gradient(45deg, #ffcc00, #ffae00); color: black; 
            padding: 12px 20px; font-weight: 900; border-radius: 8px; z-index: 100; 
            box-shadow: 0 0 30px #ffcc00; border: 2px solid white;
            animation: pulse 0.5s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }

        .menu-wrapper { position: absolute; right: 0; top: 0; height: 100vh; display: flex; align-items: center; z-index: 200; cursor: default; }
        .side-menu { background: rgba(30, 30, 35, 0.98); width: 280px; height: 100vh; padding: 20px; border-left: 2px solid #444; box-sizing: border-box; display: none; overflow-y: auto; }
        .side-menu.active { display: block; }
        .tab-container { display: flex; flex-direction: column; gap: 5px; }
        .menu-toggle { background: #ffcc00; color: #000; padding: 20px 10px; cursor: pointer; border-radius: 10px 0 0 10px; font-weight: bold; writing-mode: vertical-lr; border: none; font-size: 14px; }
        
        button { width: 100%; padding: 12px; margin: 6px 0; cursor: pointer; background: #3d3d40; color: white; border: 1px solid #555; font-size: 14px; font-weight: bold; border-radius: 8px; }
        button:hover { background: #505055; }
        .equipped { border: 2px solid #ffcc00 !important; color: #ffcc00 !important; }
        canvas { display: block; background: #252527; }
    </style>
</head>
<body>

<div id="custom-cursor">👊</div>

<div id="ui">
    <div class="stat-container">
        <div class="stat">💰 <span id="gold">0</span></div>
        <div style="font-size: 13px; color: #aaa; margin-bottom: 5px;">형진이 방어 레벨: Lv.<span id="doll-lv">1</span></div>
        <div id="hp-bar-container">
            <div id="hp-inner"></div>
            <div id="hp-bg"></div>
        </div>
    </div>
</div>

<div id="gold-rush-ui">🔥 GOLD RUSH (x5) 🔥</div>

<div class="menu-wrapper">
    <div class="tab-container">
        <button class="menu-toggle" onclick="toggleMenu('shop')">상 점</button>
        <button class="menu-toggle" style="background:#4caf50" onclick="toggleMenu('storage')">가방</button>
    </div>
    <div id="shop" class="side-menu">
        <button onclick="upgradeAtk()">🔥 내 근력 강화 (<span id="atk-cost">500</span>G)</button>
        <div id="shop-items"></div>
    </div>
    <div id="storage" class="side-menu">
        <div id="inventory-items"></div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const cursor = document.getElementById('custom-cursor');
    const goldDisplay = document.getElementById('gold');
    const hpInner = document.getElementById('hp-inner');
    const goldRushUI = document.getElementById('gold-rush-ui');

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    let gold = 0, isDead = false, atkMultiplier = 1.0, upgradeCost = 500;
    let particles = [], floatingTexts = [], bullets = [];
    let dollLv = 1;
    let clickHistory = [];
    let isGoldRush = false, goldRushTimer = 0;
    let mouseX = 0, mouseY = 0;

    const screams = ["아야!", "형진이 아파!", "그만해!", "악!", "난 게이일 뿐이야", "멈춰!", "히익!", "오마이갓!"];

    const weapons = {
        punch: { name: '기본 주먹', emoji: '👊', dmg: 20, price: 0, owned: true },
        yumi: { name: '유미', emoji: '🐱', dmg: 90, price: 500, owned: false },
        poison: { name: '독극물', emoji: '🧪', dmg: 10, price: 2000, owned: false, isPoison: true },
        fire: { name: '화염구', emoji: '🔥', dmg: 350, price: 15000, owned: false, isFire: true },
        gun: { name: '권총', emoji: '🔫', dmg: 200, price: 30000, owned: false, isGun: true },
        bomb: { name: '폭탄', emoji: '💣', dmg: 6000, price: 100000, owned: false, isExplosive: true }
    };
    let currentWeapon = 'punch';

    let doll = {
        x: canvas.width / 2, y: canvas.height / 2, vx: 0, vy: 0,
        charred: 0, poisonStacks: 0,
        parts: {
            head: { rx: 0, ry: -120, r: 45, hp: 150, max: 150, active: true },
            body: { rx: 0, ry: 0, w: 100, h: 140, hp: 500, max: 500, active: true },
            armL: { rx: -85, ry: -20, w: 35, h: 110, hp: 100, max: 100, active: true },
            armR: { rx: 85, ry: -20, w: 35, h: 110, hp: 100, max: 100, active: true },
            legL: { rx: -30, ry: 130, w: 40, h: 120, hp: 130, max: 130, active: true },
            legR: { rx: 30, ry: 130, w: 40, h: 120, hp: 130, max: 130, active: true }
        }
    };

    function toggleMenu(id) {
        const menus = document.querySelectorAll('.side-menu');
        menus.forEach(m => m.id === id ? m.classList.toggle('active') : m.classList.remove('active'));
    }

    function updateUI() {
        const shop = document.getElementById('shop-items');
        const inv = document.getElementById('inventory-items');
        shop.innerHTML = ''; inv.innerHTML = '';
        for (let id in weapons) {
            const w = weapons[id];
            const btn = document.createElement('button');
            btn.innerHTML = `${w.emoji} ${w.name} ${w.owned ? '' : '('+w.price+'G)'}`;
            if (w.owned) {
                btn.className = id === currentWeapon ? 'equipped' : '';
                btn.onclick = () => { currentWeapon = id; cursor.innerText = w.emoji; updateUI(); };
                inv.appendChild(btn);
            } else {
                btn.onclick = () => { if(gold >= w.price) { gold -= w.price; w.owned = true; updateUI(); } };
                shop.appendChild(btn);
            }
        }
        document.getElementById('atk-cost').innerText = upgradeCost;
    }

    function applyDamage(key, dmg, x, y, isAuto = false) {
        if (isDead || !doll.parts[key].active) return;
        
        const part = doll.parts[key];
        const finalDmg = dmg * atkMultiplier;
        part.hp -= finalDmg;

        // 골드 획득
        const earned = Math.floor(finalDmg * (isGoldRush ? 6 : 1.5));
        gold += earned;
        if (!isAuto) floatingTexts.push({ x: x, y: y, text: `+${earned}G`, color: isGoldRush ? "#fff" : "#ffcc00", life: 1.0 });

        // 특수 효과 (화염/독)
        if (weapons[currentWeapon].isFire) doll.charred = Math.min(1, doll.charred + 0.05);
        if (weapons[currentWeapon].isPoison) doll.poisonStacks = Math.min(100, doll.poisonStacks + 2);

        // 물리 법칙 (넉백)
        let ang = Math.atan2(doll.y + part.ry - y, doll.x + part.rx - x);
        let force = isAuto ? 2 : 18;
        doll.vx += Math.cos(ang) * force;
        doll.vy += Math.sin(ang) * force;

        // 대사 출력
        if (!isAuto && Math.random() < 0.15) {
            floatingTexts.push({ x: doll.x, y: doll.y - 150, text: screams[Math.floor(Math.random()*screams.length)], color: "#ff4444", life: 1.5, isScream: true });
        }

        if (doll.parts.body.hp <= 0) {
            isDead = true;
            gold += dollLv * 3000;
            floatingTexts.push({ x: doll.x, y: doll.y, text: `형진이 검거! +${dollLv * 3000}G`, color: "#ff4444", life: 2.0 });
            setTimeout(respawn, 1500);
        }
        createBlood(x, y, isAuto ? 1 : 6);
    }

    function respawn() {
        isDead = false; dollLv++;
        document.getElementById('doll-lv').innerText = dollLv;
        doll.charred = 0; doll.poisonStacks = 0;
        doll.x = canvas.width/2; doll.y = canvas.height/2;
        for (let k in doll.parts) {
            doll.parts[k].max *= 1.4;
            doll.parts[k].hp = doll.parts[k].max;
            doll.parts[k].active = true;
        }
    }

    function createBlood(x, y, count) {
        for(let i=0; i<count; i++) {
            particles.push({
                x, y, 
                vx: (Math.random()-0.5)*12, 
                vy: (Math.random()-0.5)*12, 
                life: 1, 
                r: Math.random()*3+2,
                color: doll.poisonStacks > 20 ? "#44ff44" : "#ff0000"
            });
        }
    }

    window.addEventListener('mousemove', (e) => { 
        mouseX = e.clientX; mouseY = e.clientY;
        cursor.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
    });

    canvas.addEventListener('mousedown', (e) => {
        if (e.clientX > canvas.width - 300) return;

        const now = Date.now();
        clickHistory.push(now);
        clickHistory = clickHistory.filter(t => now - t < 1000);
        if (clickHistory.length >= 8 && !isGoldRush) {
            isGoldRush = true; goldRushTimer = 350;
            goldRushUI.style.display = 'block';
        }

        if (weapons[currentWeapon].isGun) {
            const angle = Math.atan2(doll.y - mouseY, doll.x - mouseX);
            bullets.push({ x: mouseX, y: mouseY, vx: Math.cos(angle) * 35, vy: Math.sin(angle) * 35, dmg: weapons.gun.dmg });
            return;
        }

        for (let k in doll.parts) {
            const p = doll.parts[k]; if(!p.active) continue;
            const px = doll.x + p.rx, py = doll.y + p.ry;
            const hit = p.r ? Math.hypot(mouseX - px, mouseY - py) < p.r :
                             (mouseX > px - p.w/2 && mouseX < px + p.w/2 && mouseY > py - p.h/2 && mouseY < py + p.h/2);
            if (hit) {
                applyDamage(k, weapons[currentWeapon].dmg, mouseX, mouseY);
                break;
            }
        }
    });

    function upgradeAtk() {
        if (gold >= upgradeCost) {
            gold -= upgradeCost;
            atkMultiplier += 1.3;
            upgradeCost = Math.floor(upgradeCost * 2.3);
            updateUI();
        }
    }

    function update() {
        if (!isDead) {
            // 중력 및 물리 법칙
            doll.vy += 0.6; // 중력
            doll.x += doll.vx; doll.y += doll.vy;
            doll.vx *= 0.98; doll.vy *= 0.98;

            // 벽 튕기기 물리
            if (doll.x < 150) { doll.x = 150; doll.vx *= -0.7; }
            if (doll.x > canvas.width - 400) { doll.x = canvas.width - 400; doll.vx *= -0.7; }
            if (doll.y > canvas.height - 200) { doll.y = canvas.height - 200; doll.vy *= -0.7; }
            if (doll.y < 150) { doll.y = 150; doll.vy *= -0.7; }

            // 독 데미지
            if (doll.poisonStacks > 0) {
                applyDamage('body', doll.poisonStacks * 0.1, doll.x, doll.y, true);
                doll.poisonStacks -= 0.05;
            }
        }

        // 총알 물리
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i]; b.x += b.vx; b.y += b.vy;
            if (Math.hypot(b.x - doll.x, b.y - doll.y) < 120) {
                applyDamage('body', b.dmg, b.x, b.y); bullets.splice(i, 1);
            } else if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(i, 1);
        }

        if (isGoldRush) {
            goldRushTimer--;
            if (goldRushTimer <= 0) { isGoldRush = false; goldRushUI.style.display = 'none'; }
        }

        goldDisplay.innerText = Math.floor(gold).toLocaleString();
        const body = doll.parts.body;
        hpInner.style.width = Math.max(0, (body.hp / body.max) * 100) + "%";
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 인형 모든 파츠 그리기 (머리, 몸통, 팔, 다리)
        for (let k in doll.parts) {
            const p = doll.parts[k]; if (!p.active) continue;
            const px = doll.x + p.rx, py = doll.y + p.ry;
            
            // 상태에 따른 색 변화 (화염에 타면 검게, 독에 중독되면 초록색)
            let r = 224 - (doll.charred * 180), g = 172 - (doll.charred * 150), b = 105 - (doll.charred * 90);
            if (doll.poisonStacks > 10) { g += 50; r -= 30; }
            
            ctx.fillStyle = isDead ? "#444" : `rgb(${r},${g},${b})`;
            ctx.strokeStyle = "#000"; ctx.lineWidth = 3;

            if (p.r) {
                ctx.beginPath(); ctx.arc(px, py, p.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                if (k === 'head') {
                    ctx.fillStyle = "#000";
                    if (!isDead) {
                        ctx.fillRect(px-15, py-10, 5, 5); ctx.fillRect(px+10, py-10, 5, 5);
                        ctx.beginPath(); ctx.arc(px, py+15, 12, 0, Math.PI); ctx.stroke();
                    } else { ctx.font = "20px Arial"; ctx.fillText("X X", px-15, py+5); }
                }
            } else {
                ctx.fillRect(px - p.w/2, py - p.h/2, p.w, p.h); ctx.strokeRect(px - p.w/2, py - p.h/2, p.w, p.h);
            }
        }

        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.life -= 0.02;
            ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            if(p.life <= 0) particles.splice(i, 1);
        });

        floatingTexts.forEach((t, i) => {
            ctx.globalAlpha = t.life; ctx.fillStyle = t.color; 
            ctx.font = t.isScream ? "bold 30px sans-serif" : "bold 24px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(t.text, t.x, t.y); t.y -= 1.5; t.life -= 0.015;
            if(t.life <= 0) floatingTexts.splice(i, 1);
        });
        ctx.globalAlpha = 1;

        ctx.fillStyle = "#ffcc00";
        bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill(); });

        update();
        requestAnimationFrame(draw);
    }

    updateUI();
    draw();
</script>
</body>
</html>
