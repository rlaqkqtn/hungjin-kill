<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ragdoll Clicker - No Escape Edition</title>
    <style>
        body { margin: 0; background-color: #050505; color: white; font-family: 'Arial', sans-serif; overflow: hidden; user-select: none; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; }
        .stat { font-size: 32px; margin-bottom: 5px; color: #ff3333; text-shadow: 2px 2px 4px #000; font-weight: bold; }
        #shop { position: absolute; right: 20px; top: 20px; background: rgba(30, 0, 0, 0.9); padding: 15px; border-radius: 15px; border: 3px solid #ff0000; width: 240px; z-index: 10; }
        .shop-title { margin: 0 0 10px 0; color: #ff0000; font-size: 22px; text-align: center; font-weight: bold; }
        button { width: 100%; padding: 12px; margin: 5px 0; cursor: pointer; background: #800; color: white; border: 2px solid #f00; font-size: 16px; font-weight: bold; border-radius: 8px; }
        button:hover { background: #b00; }
        canvas { background: radial-gradient(circle, #222 0%, #050505 100%); display: block; }
        
        /* 맵 경계 비주얼 (감옥 느낌) */
        #cage-effect {
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 8px double rgba(255, 0, 0, 0.5);
            pointer-events: none;
            border-radius: 10px;
            box-shadow: inset 0 0 100px rgba(255, 0, 0, 0.2);
        }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat">골드: <span id="gold">0</span>G</div>
    <div class="stat">형진이 HP: <span id="hp">100</span> / <span id="max-hp">100</span></div>
</div>

<div id="shop">
    <div class="shop-title">무기 상점</div>
    <button onclick="addWeapon('🗡️', 100, 30)">칼 (100G)</button>
    <button onclick="addWeapon('⚙️', 300, 25)">톱니바퀴 (300G)</button>
    <button onclick="addWeapon('🔥', 800, 15)">화염방사기 (800G)</button>
    <button onclick="addWeapon('💣', 1500, 200)">폭탄 (1500G)</button>
    <button onclick="addWeapon('🐈', 3000, 15, true)">유미 소환 (3000G)</button>
</div>

<div id="cage-effect"></div>
<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let gold = 0, maxHp = 100, hp = 100, isDead = false;
    let particles = [], weapons = [], floatingTexts = [];
    let draggedObj = null, mouseX = 0, mouseY = 0;

    // --- 1. 타격음 수정 (고음역대의 찰진 소리) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playImpactSound(freq = 800, decay = 0.1, type = 'square') {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = type; // square나 triangle이 '찰진' 느낌을 줌
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        // 주파수를 빠르게 떨어뜨려 '틱' 하는 타격감 생성
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + decay);
        
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + decay);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + decay);
    }

    let doll = {
        x: canvas.width / 2, y: canvas.height / 2,
        vx: 0, vy: 0, 
        w: 100, h: 150 // 충격 박스 크기
    };

    function applyDamage(amount, x, y, isClick = false) {
        if (isDead) return;
        hp -= amount;
        gold += isClick ? 10 : amount * 0.4;
        
        // 찰진 고음 타격음
        if (isClick) playImpactSound(1200, 0.08, 'square'); 
        else playImpactSound(900, 0.05, 'triangle');

        if (Math.random() < 0.2) createBlood(x, y, 5);
        if (hp <= 0) die();
    }

    function die() {
        if (isDead) return;
        isDead = true; hp = 0;
        playImpactSound(200, 0.5, 'sawtooth'); // 사망 소리
        setTimeout(() => {
            isDead = false;
            maxHp = Math.floor(maxHp * 1.2);
            hp = maxHp;
            doll.x = canvas.width / 2; doll.y = 300;
            doll.vx = 0; doll.vy = 0;
        }, 1000);
    }

    function addWeapon(emoji, price, dmg, isYumi = false) {
        if(gold >= price) {
            gold -= price;
            weapons.push({ x: canvas.width/2, y: canvas.height/2, emoji, dmg, isYumi, size: 60 });
        }
    }

    // --- 2. 맵 밖 이탈 방지 로직 (강력 조치) ---
    function keepInBounds(obj, margin = 50) {
        if (obj.x < margin) { obj.x = margin; obj.vx *= -0.5; }
        if (obj.x > canvas.width - margin) { obj.x = canvas.width - margin; obj.vx *= -0.5; }
        if (obj.y < margin) { obj.y = margin; obj.vy *= -0.5; }
        if (obj.y > canvas.height - margin) { obj.y = canvas.height - margin; obj.vy *= -0.5; }
    }

    canvas.addEventListener('mousedown', (e) => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        let mx = e.clientX, my = e.clientY;
        draggedObj = weapons.find(w => Math.sqrt((mx-w.x)**2 + (my-w.y)**2) < 40);
        if(!draggedObj && !isDead) {
            if(Math.sqrt((mx-doll.x)**2 + (my-doll.y)**2) < 80) {
                applyDamage(15, mx, my, true);
                draggedObj = doll;
            }
        }
    });

    window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
    window.addEventListener('mouseup', () => { draggedObj = null; });

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const margin = 60; // 맵 경계선 두께

        // 인형 물리 및 도망 AI
        if(!isDead) {
            if (draggedObj === doll) {
                doll.x = mouseX; doll.y = mouseY;
                doll.vx = 0; doll.vy = 0;
            } else {
                // 커서 피하기
                let dx = doll.x - mouseX, dy = doll.y - mouseY;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < 200) { doll.vx += (dx/dist)*0.6; doll.vy += (dy/dist)*0.6; }
                
                doll.x += doll.vx; doll.y += doll.vy;
                doll.vy += 0.5; // 중력
                doll.vx *= 0.95; doll.vy *= 0.95;
            }
            // 강력한 경계 체크
            keepInBounds(doll, margin);
        }

        // 무기 로직
        weapons.forEach(w => {
            if (draggedObj === w) { w.x = mouseX; w.y = mouseY; }
            else if (w.isYumi && !isDead) {
                let dx = doll.x - w.x, dy = doll.y - w.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if(dist > 30) { w.x += (dx/dist)*5; w.y += (dy/dist)*5; }
            }
            keepInBounds(w, margin);

            ctx.font = `${w.size}px Arial`;
            ctx.fillText(w.emoji, w.x - w.size/2, w.y + w.size/2);

            if(Math.sqrt((w.x-doll.x)**2 + (w.y-doll.y)**2) < 70 && !isDead) {
                applyDamage(w.dmg / 10, w.x, w.y, false);
            }
        });

        // 인형 그리기 (심플 래그돌)
        ctx.fillStyle = isDead ? '#555' : '#e0ac69';
        ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
        // 몸통
        ctx.fillRect(doll.x-20, doll.y-40, 40, 80);
        ctx.strokeRect(doll.x-20, doll.y-40, 40, 80);
        // 머리
        ctx.beginPath(); ctx.arc(doll.x, doll.y-70, 25, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        // 팔다리 (간단하게)
        ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(doll.x-20, doll.y-30); ctx.lineTo(doll.x-50, doll.y+10); ctx.stroke(); // 왼팔
        ctx.beginPath(); ctx.moveTo(doll.x+20, doll.y-30); ctx.lineTo(doll.x+50, doll.y+10); ctx.stroke(); // 오른팔

        // 혈흔 효과
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.02;
            ctx.fillStyle = `rgba(255,0,0,${p.life})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            if(p.life <= 0) particles.splice(i, 1);
        });

        document.getElementById('gold').innerText = Math.floor(gold);
        document.getElementById('hp').innerText = Math.ceil(hp);
        document.getElementById('max-hp').innerText = maxHp;
        requestAnimationFrame(render);
    }

    function createBlood(x, y, amount) {
        for(let i=0; i<amount; i++) {
            particles.push({ x, y, vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12, r: Math.random()*5+2, life: 1 });
        }
    }

    render();
</script>
</body>
</html>
