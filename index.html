<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Ragdoll Clicker - 형진이 고문 모드</title>
    <style>
        body { margin: 0; background-color: #050505; color: white; font-family: 'Arial', sans-serif; overflow: hidden; user-select: none; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; }
        .stat { font-size: 28px; margin-bottom: 5px; color: #ff3333; text-shadow: 2px 2px 4px #000; font-weight: bold; }
        #shop { position: absolute; right: 20px; top: 20px; background: rgba(20, 0, 0, 0.9); padding: 15px; border-radius: 15px; border: 3px solid #ff0000; width: 220px; }
        button { width: 100%; padding: 10px; margin: 5px 0; cursor: pointer; background: #600; color: white; border: 1px solid #f00; font-size: 14px; font-weight: bold; }
        button:hover { background: #a00; }
        canvas { background: #0a0a0a; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat">골드: <span id="gold">0</span>G</div>
    <div class="stat">형진이 HP: <span id="hp">100</span> / <span id="max-hp">100</span></div>
</div>

<div id="shop">
    <h3 style="margin:0 0 10px 0; color:#ff0000; font-size:18px;">무기 구매 (드래그 가능)</h3>
    <button onclick="addWeapon('🗡️', 100, 15)">칼 구매 (100G)</button>
    <button onclick="addWeapon('🔥', 500, 5)">화염방사기 (500G)</button>
    <button onclick="addWeapon('💣', 1000, 100)">폭탄 구매 (1000G)</button>
    <button onclick="addWeapon('🐈', 2000, 10)">유미 소환 (2000G)</button>
    <button onclick="addWeapon('⚙️', 300, 2)">톱니바퀴 (300G)</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let gold = 0;
    let maxHp = 100;
    let hp = 100;
    let isDead = false;

    let particles = [];
    let weapons = []; // 24. 모든 무기 객체 관리
    let floatingTexts = [];
    let draggedObj = null;

    const quotes = ["아야!", "그만해!", "Don't do that!", "제발!", "때리지마!", "형진이는 아프다..", "살려줘!"];

    let doll = {
        x: canvas.width / 2, y: canvas.height / 2,
        vx: 0, vy: 0, angle: 0,
        parts: [
            { name: 'head', rx: 0, ry: -70, r: 25, active: true },
            { name: 'body', rx: 0, ry: 0, w: 45, h: 70, active: true },
            { name: 'armL', rx: -35, ry: -15, w: 15, h: 45, active: true },
            { name: 'armR', rx: 35, ry: -15, w: 15, h: 45, active: true },
            { name: 'legL', rx: -15, ry: 65, w: 18, h: 55, active: true },
            { name: 'legR', rx: 15, ry: 65, w: 18, h: 55, active: true }
        ]
    };

    function createBlood(x, y, amount = 15) {
        for(let i=0; i<amount; i++) {
            particles.push({
                x, y, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15,
                r: Math.random()*5 + 2, life: 1.5
            });
        }
    }

    function speak() {
        if(Math.random() < 0.1) {
            floatingTexts.push({ x: doll.x, y: doll.y - 120, text: quotes[Math.floor(Math.random()*quotes.length)], life: 1.2 });
        }
    }

    function applyDamage(amount) {
        if (isDead) return;
        hp -= amount;
        gold += amount * 0.8;
        if (Math.random() < 0.05) speak();
        if (Math.random() < 0.03) slicePart();
        if (hp <= 0) die();
    }

    function slicePart() {
        let targets = doll.parts.filter(p => p.active && p.name !== 'body');
        if (targets.length > 0) {
            let part = targets[Math.floor(Math.random() * targets.length)];
            part.active = false;
            createBlood(doll.x + part.rx, doll.y + part.ry, 40);
        }
    }

    function drawDoll() {
        ctx.save();
        ctx.translate(doll.x, doll.y);
        ctx.rotate(doll.angle);
        if(!isDead) {
            ctx.fillStyle = "white"; ctx.font = "bold 20px Arial"; ctx.textAlign = "center";
            ctx.fillText("형진", 0, -110);
        }
        doll.parts.forEach(p => {
            if (!p.active) return;
            ctx.fillStyle = isDead ? '#300' : '#e0ac69';
            ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
            ctx.save();
            ctx.translate(p.rx, p.ry);
            if (p.name === 'head') {
                ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            } else {
                ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h); ctx.strokeRect(-p.w/2, -p.h/2, p.w, p.h);
            }
            ctx.restore();
        });
        ctx.restore();
    }

    // 24. 무기 추가 시스템 (잡고 움직일 수 있는 객체)
    function addWeapon(emoji, price, dmg) {
        if(gold >= price || price === 0) {
            if(price > 0) gold -= price;
            weapons.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                emoji: emoji,
                dmg: dmg,
                size: 40,
                angle: 0
            });
        }
    }

    function die() {
        if (isDead) return;
        isDead = true;
        hp = 0;
        createBlood(doll.x, doll.y, 80);
        // 25. 사망 메시지 삭제 및 1초 후 부활
        setTimeout(() => {
            respawn();
        }, 1000);
    }

    function respawn() {
        isDead = false;
        maxHp = Math.floor(maxHp * 1.15); // 18. 증가율 완화
        hp = maxHp;
        doll.parts.forEach(p => p.active = true);
        doll.x = canvas.width / 2; doll.y = 200;
        doll.vx = 0; doll.vy = 0; doll.angle = 0;
    }

    canvas.addEventListener('mousedown', (e) => {
        let mx = e.clientX, my = e.clientY;
        // 무기 잡기 우선 체크
        draggedObj = weapons.find(w => Math.sqrt((mx-w.x)**2 + (my-w.y)**2) < 40);
        
        // 무기가 없으면 인형 잡기
        if(!draggedObj && !isDead) {
            if(Math.sqrt((mx-doll.x)**2 + (my-doll.y)**2) < 100) {
                draggedObj = doll;
            }
        }
    });

    window.addEventListener('mousemove', (e) => {
        if(draggedObj) {
            draggedObj.x = e.clientX;
            draggedObj.y = e.clientY;
            if(draggedObj === doll) { doll.vx = 0; doll.vy = 0; }
        }
    });

    window.addEventListener('mouseup', () => { draggedObj = null; });

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 23. 인형 도망가기 AI
        if(!isDead && draggedObj !== doll) {
            // 무기가 가까이 오면 반대 방향으로 힘을 받음
            weapons.forEach(w => {
                let dx = doll.x - w.x;
                let dy = doll.y - w.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < 200) {
                    doll.vx += (dx / dist) * 0.5; // 도망가는 속도
                    doll.vy += (dy / dist) * 0.5;
                }
            });

            doll.x += doll.vx; doll.y += doll.vy;
            doll.vx *= 0.95; doll.vy *= 0.95;
            doll.vy += 0.3; // 중력

            if(doll.x < 50 || doll.x > canvas.width-50) doll.vx *= -0.7;
            if(doll.y > canvas.height-80) { doll.y = canvas.height-80; doll.vy *= -0.3; }
        }

        // 무기 그리기 및 충돌 체크
        weapons.forEach(w => {
            ctx.font = "40px Arial";
            ctx.save();
            ctx.translate(w.x, w.y);
            if(w.emoji === '⚙️') { w.angle += 0.1; ctx.rotate(w.angle); }
            ctx.fillText(w.emoji, -20, 15);
            ctx.restore();

            // 인형과 충돌 시 데미지
            let d = Math.sqrt((w.x - doll.x)**2 + (w.y - doll.y)**2);
            if(d < 80 && !isDead) {
                applyDamage(w.dmg / 10);
                if(Math.random() < 0.1) createBlood(doll.x, doll.y, 5);
            }
        });

        drawDoll();

        // 파티클/텍스트 업데이트
        particles.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life -= 0.02;
            ctx.fillStyle = `rgba(255,0,0,${p.life})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
            if(p.life <= 0) particles.splice(i, 1);
        });

        floatingTexts.forEach((t, i) => {
            ctx.fillStyle = `rgba(255,255,255,${t.life})`;
            ctx.font = 'bold 25px Arial'; ctx.fillText(t.text, t.x - 50, t.y);
            t.y -= 1; t.life -= 0.01;
            if(t.life <= 0) floatingTexts.splice(i, 1);
        });

        document.getElementById('gold').innerText = Math.floor(gold);
        document.getElementById('hp').innerText = Math.ceil(hp);
        document.getElementById('max-hp').innerText = maxHp;
        requestAnimationFrame(render);
    }
    render();
</script>
</body>
</html>
